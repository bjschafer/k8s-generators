[tools]
bun = "latest"
# Tracks the cluster's k3s release (K3S_VERSION in lib/consts.ts), not kubectl's
# own latest -- KUBE_VERSION below feeds `helm template`'s .Capabilities, so a
# kubectl ahead of the apiserver re-renders manifests against an API surface the
# cluster does not have. Renovate is disabled for this entry so it can only move
# with a k3s bump; see renovate.json.
kubectl = "1.36.3"
# Must stay on 3.x: cdk8s's HelmApp shells out to this binary and is built
# against the Helm 3 CLI. Constrained in renovate.json rather than left to a
# comment.
helm = "3.21.4"
# Renders the velero CRDs (`velero install --crds-only`), so the CLI version IS
# the CRD version -- unlike helm above, which only pulls a chart at a version
# passed to it. tools/sources.ts pins the same version and hard-fails if the
# installed CLI disagrees, so these two must be bumped together; renovate.json
# groups them into one PR to keep that true.
velero = "1.18.2"
promtool = "latest"
pint = "latest"
"aqua:prometheus/alertmanager" = "latest"
bitwarden-secrets-manager = "latest"
# vlogscli ships bundled with vlagent inside the `vlutils` release archive;
# pin the exe + asset so the github backend extracts the right binary.
"github:VictoriaMetrics/VictoriaLogs[exe=vlogscli-prod,matching=vlutils]" = "latest"

[env]
# Derived from the pinned kubectl above so helm template uses the right .Capabilities.KubeVersion
KUBE_VERSION = { value = "v{{ tools.kubectl.version }}", tools = true }


[tasks.clean-full]
description = "Remove all generated files"
depends = ["clean"]
run = """
#!/usr/bin/env bash
set -euo pipefail
rm -rf apps/**/*.js apps/**/*.d.ts
rm -rf lib/*.js lib/*.d.ts lib/**/*.js lib/**/*.d.ts
rm -rf imports/*.js imports/*.d.ts
"""

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.upgrade]
description = "Upgrade dependencies"
run = "bun update"

[tasks.format]
description = "Alias for fmt"
depends = ["fmt"]

[tasks.fmt]
description = "Format TypeScript files"
depends = ["install"]
run = 'bun x oxfmt --write "**/*.ts"'

[tasks.lint]
description = "Lint TypeScript files"
depends = ["install"]
run = 'bun x oxlint apps/ lib/ tools/'

[tasks.typecheck]
description = "Type-check TypeScript files"
depends = ["install"]
run = "bun x tsc --noEmit"

[tasks.check]
description = "Format, lint, validate alerts, and typecheck"
depends = ["fmt", "lint", "validate-alerts", "typecheck"]

[tasks.schemas]
description = "Generate TypeScript types from JSON schemas"
depends = ["install"]
# `build` depends on this, so the generated types can never lag the schemas
# they come from. sources/outputs keep that from costing a json2ts run on
# every build -- mise skips it when schemas/ hasn't moved. Refreshing the
# schemas themselves from upstream is `mise run update-schemas`.
sources = ["schemas/*.json"]
outputs = ["imports/helm-values/*.d.ts"]
run = 'bun x json2ts -i schemas/ -o imports/helm-values/'

# Guards the invariant the Renovate automation quietly depends on: main is
# always green. A Renovate branch inherits main's tree and cannot fix a
# breakage it didn't cause -- so when main is red, every Renovate PR dies at
# that same inherited step, and the regen/sync step in .github/workflows/ci.yaml
# (deliberately the last one in the job) never runs. The result is a version
# bump landing with no regenerated dist/, which is exactly how metrics drifted
# at 0.87.0. Running CI's gates locally keeps a red main from being committed
# in the first place. Bypass with `git commit --no-verify` when you mean to.
[tasks.pre-commit]
description = "Run CI's gates locally before committing (install via `mise run setup-hooks`)"
depends = ["install"]
run = """
#!/usr/bin/env bash
set -euo pipefail

# Both write in place; --force bypasses build's source-based caching so dist/
# is always regenerated from source, matching what CI checks.
mise run fmt
mise run --force build

# Anything the two steps above changed now shows as unstaged. Scoped to the
# paths they can touch so unrelated work-in-progress doesn't trip the hook.
if ! git diff --quiet -- '*.ts' dist/; then
  {
    echo
    echo "pre-commit: fmt/build changed files that aren't staged:"
    git diff --name-only -- '*.ts' dist/ | sed 's/^/  /'
    echo
    echo "They're already fixed in your working tree -- 'git add' them and commit again."
  } >&2
  exit 1
fi

mise run lint
mise run typecheck
mise run validate-alerts
"""

[tasks.setup-hooks]
description = "Install the git pre-commit hook that runs `mise run pre-commit`"
run = "mise generate git-pre-commit --write --task=pre-commit"

# Applications nest three deep: `applications` (from k8s-prod) owns
# `generators`, which owns every per-app Application, and all three run
# selfHeal. Patching a child on its own reads back clean and is then silently
# reverted within about a minute, so the only symptom is some unrelated manual
# change -- a scale, a deleted resource -- bouncing back with nothing pointing
# at ArgoCD. Hence: parents first, then verify by re-reading.
[tasks.argo-suspend]
description = "Pause ArgoCD automated sync (parents + any named apps) for manual cluster surgery"
# Muscle memory from k8s-prod/scripts/suspend-sync.sh, which this replaces.
alias = "suspend-sync"
run = """
#!/usr/bin/env bash
set -euo pipefail

apps=(applications generators)
for a in "$@"; do apps+=("$a"); done

for app in "${apps[@]}"; do
  if ! kubectl -n argocd get application "$app" >/dev/null 2>&1; then
    echo "no such application: $app" >&2
    exit 1
  fi
done

for app in "${apps[@]}"; do
  kubectl -n argocd patch application "$app" --type=merge \\
    -p '{"spec":{"syncPolicy":{"automated":null}}}' >/dev/null
  echo "suspended $app"
done

# Don't trust the patch. A parent still mid-reconcile when its child was
# patched will have healed that child back by the time this check runs.
sleep 15
rc=0
for app in "${apps[@]}"; do
  auto=$(kubectl -n argocd get application "$app" -o jsonpath='{.spec.syncPolicy.automated}')
  if [ -n "$auto" ]; then
    echo "STILL AUTOMATED: $app -> $auto" >&2
    rc=1
  fi
done

if [ "$rc" -ne 0 ]; then
  echo "suspend did not stick -- do not start making changes" >&2
  exit 1
fi
echo "all suspended; remember 'mise run argo-resume ${*}'"
"""

[tasks.argo-resume]
description = "Restore ArgoCD automated sync suspended by `argo-suspend`"
alias = "resume-sync"
run = """
#!/usr/bin/env bash
set -euo pipefail

# Children first, so resuming a parent can't re-sync a child out from under a
# restore that is still in progress. The policy set here is the one every app
# carries in git; the next reconcile corrects it either way.
apps=()
for a in "$@"; do apps+=("$a"); done
apps+=(generators applications)

for app in "${apps[@]}"; do
  kubectl -n argocd patch application "$app" --type=merge \\
    -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}' >/dev/null
  echo "resumed $app"
done

sleep 10
kubectl -n argocd get applications.argoproj.io \\
  -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status' \\
  --no-headers | grep -v 'Synced *Healthy' || echo "all applications Synced/Healthy"
"""

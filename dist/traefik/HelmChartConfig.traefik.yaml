apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 3
    additionalArguments:
      # these shouldn't be necessary in later versions of traefik
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=600s
      - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=600s
      - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=600s
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: 'Host(`traefik-k8s.cmdcentral.xyz`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))'
        entryPoints:
          - traefik
          - web
          - websecure
    ports:
      web:
        # Must sit under `http:` -- the chart silently ignored the older
        # top-level `redirections` key, which left every host answering in
        # plaintext on :80.
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
        # Only trust X-Forwarded-*/PROXY from pods (cloudflared). LAN clients
        # don't need it: externalTrafficPolicy Local already hands Traefik
        # their real source address, and trusting them let anyone spoof it.
        forwardedHeaders:
          trustedIPs: ["10.42.0.0/16"]
        proxyProtocol:
          trustedIPs: ["10.42.0.0/16"]
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 600s
            idleTimeout: 600s
            writeTimeout: 600s
        forwardedHeaders:
          trustedIPs: ["10.42.0.0/16"]
        proxyProtocol:
          trustedIPs: ["10.42.0.0/16"]
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
      kubernetesGateway:
        enabled: true
    service:
      annotations:
        metallb.io/loadBalancerIPs: 10.0.10.80
        external-dns.kubernetes.io/hostname: traefik-k8s.cmdcentral.xyz
      spec:
        externalTrafficPolicy: Local

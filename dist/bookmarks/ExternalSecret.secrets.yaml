apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: bookmarks
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/bookmarks/secrets
        metadataPolicy: None
        property: AUTHENTIK_CLIENT_ID
      secretKey: AUTHENTIK_CLIENT_ID
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/bookmarks/secrets
        metadataPolicy: None
        property: AUTHENTIK_CLIENT_SECRET
      secretKey: AUTHENTIK_CLIENT_SECRET
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/bookmarks/secrets
        metadataPolicy: None
        property: DATABASE_URL
      secretKey: DATABASE_URL
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/bookmarks/secrets
        metadataPolicy: None
        property: NEXTAUTH_SECRET
      secretKey: NEXTAUTH_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: secrets

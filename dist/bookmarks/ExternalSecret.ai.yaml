apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai
  namespace: bookmarks
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/bookmarks/ai
        metadataPolicy: None
        property: CUSTOM_OPENAI_BASE_URL
      secretKey: CUSTOM_OPENAI_BASE_URL
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/bookmarks/ai
        metadataPolicy: None
        property: OPENAI_API_KEY
      secretKey: OPENAI_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ai

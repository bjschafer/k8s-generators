apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-creds
  namespace: velero
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/velero/s3-creds
        metadataPolicy: None
        property: config
      secretKey: config
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: s3-creds

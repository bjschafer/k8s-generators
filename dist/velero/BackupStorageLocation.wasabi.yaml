apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: wasabi
  namespace: velero
spec:
  config:
    profile: wasabi
    region: us-central-1
    s3ForcePathStyle: "true"
    s3Url: https://s3.us-central-1.wasabisys.com
  credential:
    key: config
    name: s3-creds
  objectStorage:
    bucket: cmdcentral-k8s-backups
    prefix: velero
  provider: aws

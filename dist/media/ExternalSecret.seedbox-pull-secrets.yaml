apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seedbox-pull-secrets
  namespace: media
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/media/seedbox-pull-secrets
        metadataPolicy: None
        property: SEEDBOX_PASSWORD
      secretKey: SEEDBOX_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: seedbox-pull-secrets

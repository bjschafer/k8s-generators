apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: checkrr-config
  namespace: media
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: 9a5c19fe-540f-4118-b27d-b47e01821945
        metadataPolicy: None
      secretKey: SONARR_APIKEY
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: 5c46e216-ac6c-4cd0-a268-b47e0182092b
        metadataPolicy: None
      secretKey: RADARR_APIKEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: checkrr-config
    template:
      data:
        checkrr.yaml: |
          # Rendered twice (see checkrr.ts): the @@NAME@@ placeholders are filled in at
          # synth time from CheckrrProps, then the result becomes an external-secrets
          # template, which fills in the Go-template ones -- the *arr API keys -- from
          # Bitwarden. Comments are rendered too, so never write template braces in one.
          lang: "en-us"
          checkrr:
            checkpath:
              - "/tv/"
              - "/movies/"
            database: /data/checkrr.db
            csvfile: /data/badfiles.csv
            cron: "0 4 * * *"
            debug: false
            ignorehidden: true
            ffprobe: true
            ffmpeg-quick: false
            ffmpeg-full: false
            ignorepaths:
              # Despecialized's restoration tooling: thousands of C++ sources, every one
              # an "unknown file".
              - "/movies/Star Wars Despecialized/"
              # BitTorrent v2 padding files (BEP 47). ignorehidden only checks a file's
              # own name, not its parent directories, so it misses these.
              - "/.____padding_file/"
            # Anything not recognised as audio/video/image/text is an "unknown file",
            # which is reported -- and, with reacquire on, sent to the *arr -- on every
            # run, since only valid media is remembered in the hash database. These are
            # the benign non-media types actually found in the library. .m2ts and .wmv
            # are real video that checkrr's type sniffing doesn't recognise, so they are
            # never probed either way. Disc images (.iso, .mds) and .zip junk are left
            # flagged on purpose, as things to clean up.
            ignoreexts:
              - .txt
              - .nfo
              - .nfo-orig
              - .nzb
              - .url
              - .srr
              - .idx
              - .sub
              - .sup
              - .db
              - .sqlite
              - .xml
              - .svg
              - .srt
              - .par2
              - .m2ts
              - .wmv
          logs:
            stdout:
              out: stdout
              formatter: default
          arr:
            sonarr:
              process: true
              service: sonarr
              address: sonarr.media.svc.cluster.local
              apikey: "{{ .SONARR_APIKEY }}"
              baseurl: /
              port: 8989
              ssl: false
              mappings:
                "/tv/": "/tv/"
            # Report-only, permanently. checkrr's Radarr RemoveFile matches a bad file to
            # a movie by *folder substring*, then deletes that movie's main file: an
            # unknown subtitle or extra in "Aliens (1986)/" deletes the movie, and so can
            # one in any folder whose path merely contains "/movies/Alien". Sonarr's
            # matches the exact episode file path, so only it gets to reacquire.
            radarr:
              process: false
              service: radarr
              address: radarr.media.svc.cluster.local
              apikey: "{{ .RADARR_APIKEY }}"
              baseurl: /
              port: 7878
              ssl: false
              mappings:
                "/movies/": "/movies/"
          webserver:
            port: 8585
            tls: false
            baseurl: "/"
      engineVersion: v2

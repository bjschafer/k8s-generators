apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-api
  namespace: media
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/media/sonarr-api
        metadataPolicy: None
        property: APIKEY
      secretKey: APIKEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: sonarr-api

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa-secrets
  namespace: media
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/media/kometa-secrets
        metadataPolicy: None
        property: KOMETA_PLEXTOKEN
      secretKey: KOMETA_PLEXTOKEN
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/media/kometa-secrets
        metadataPolicy: None
        property: KOMETA_TMDBAPIKEY
      secretKey: KOMETA_TMDBAPIKEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kometa-secrets

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome-lastfm
  namespace: media
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/media/navidrome-lastfm
        metadataPolicy: None
        property: ND_LASTFM_APIKEY
      secretKey: ND_LASTFM_APIKEY
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/media/navidrome-lastfm
        metadataPolicy: None
        property: ND_LASTFM__SECRET
      secretKey: ND_LASTFM__SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: navidrome-lastfm

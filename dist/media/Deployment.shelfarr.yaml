apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: media
  name: shelfarr
  namespace: media
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: shelfarr-shelfarr-deployment-c82600bc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        cdk8s.io/metadata.addr: shelfarr-shelfarr-deployment-c82600bc
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: PUID
              value: "8675309"
            - name: PGID
              value: "8675309"
            - name: HTTP_PORT
              value: "5056"
            - name: SHELFARR_SETTING_OIDC_ENABLED
              value: "true"
            - name: SHELFARR_SETTING_OIDC_PROVIDER_NAME
              value: Authentik
            - name: SHELFARR_SETTING_OIDC_ISSUER
              value: https://login.cmdcentral.xyz/application/o/shelfarr/
            - name: SHELFARR_SETTING_OIDC_CLIENT_ID
              value: 08ae198e701da5e7b18226e2fd091655939dc5c7
            - name: SHELFARR_SETTING_OIDC_SCOPES
              value: openid profile email
            - name: SHELFARR_SETTING_OIDC_AUTO_REDIRECT
              value: "true"
            - name: SHELFARR_SETTING_OIDC_AUTO_CREATE_USERS
              value: "true"
            - name: SHELFARR_SETTING_OIDC_DEFAULT_ROLE
              value: user
            - name: SHELFARR_SETTING_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: SHELFARR_SETTING_OIDC_CLIENT_SECRET
                  name: shelfarr-oidc
          image: ghcr.io/pedro-revez-silva/shelfarr:latest
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 180
            tcpSocket:
              port: 5056
          name: shelfarr
          ports:
            - containerPort: 5056
              name: http
          readinessProbe:
            failureThreshold: 3
            tcpSocket:
              port: 5056
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          volumeMounts:
            - mountPath: /rails/storage
              name: pvc-shelfarr
            - mountPath: /rails/tmp/cache
              name: shelfarr-rails-tmp-cache
            - mountPath: /downloads
              name: pvc-nfs-media-downloads
            - mountPath: /ebooks
              name: pvc-nfs-media-ebooks
            - mountPath: /audiobooks
              name: pvc-nfs-media-audiobooks
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroup: 8675309
        fsGroupChangePolicy: Always
        runAsNonRoot: false
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: pvc-shelfarr
          persistentVolumeClaim:
            claimName: shelfarr
            readOnly: false
        - emptyDir:
            sizeLimit: 1024Mi
          name: shelfarr-rails-tmp-cache
        - name: pvc-nfs-media-downloads
          persistentVolumeClaim:
            claimName: nfs-media-downloads
            readOnly: false
        - name: pvc-nfs-media-ebooks
          persistentVolumeClaim:
            claimName: nfs-media-ebooks
            readOnly: false
        - name: pvc-nfs-media-audiobooks
          persistentVolumeClaim:
            claimName: nfs-media-audiobooks
            readOnly: false

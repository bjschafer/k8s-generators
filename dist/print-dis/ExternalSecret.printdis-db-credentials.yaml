apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: printdis-db-credentials
  namespace: print-dis
spec:
  data:
    - remoteRef:
        key: printdis-db-credentials
        property: password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes
  target:
    name: printdis-db-credentials

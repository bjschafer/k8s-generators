apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
  namespace: print-dis
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/print-dis/authentik
        metadataPolicy: None
        property: client_id
      secretKey: client_id
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/print-dis/authentik
        metadataPolicy: None
        property: client_secret
      secretKey: client_secret
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik

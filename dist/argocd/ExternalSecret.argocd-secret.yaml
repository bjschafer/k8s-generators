apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/argocd/authentik
        metadataPolicy: None
        property: client_secret
      secretKey: dex.authentik.clientSecret
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/argocd/argocd-secret
        metadataPolicy: None
        property: server.secretkey
      secretKey: server.secretkey
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/argocd/argocd-secret
        metadataPolicy: None
        property: admin.password
      secretKey: admin.password
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/argocd/argocd-secret
        metadataPolicy: None
        property: admin.passwordMtime
      secretKey: admin.passwordMtime
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/argocd/argocd-secret
        metadataPolicy: None
        property: accounts.bschafer.password
      secretKey: accounts.bschafer.password
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/argocd/argocd-secret
        metadataPolicy: None
        property: accounts.bschafer.passwordMtime
      secretKey: accounts.bschafer.passwordMtime
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: CreateOrMerge
    name: argocd-secret
    template:
      metadata:
        labels:
          app.kubernetes.io/name: argocd-secret
          app.kubernetes.io/part-of: argocd

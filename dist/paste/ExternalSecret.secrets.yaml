apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: paste
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/paste/secrets
        metadataPolicy: None
        property: MICROBIN_ADMIN_PASSWORD
      secretKey: MICROBIN_ADMIN_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: secrets

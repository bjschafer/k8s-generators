apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: immich-microservices
  namespace: immich
spec:
  endpoints:
    - port: metrics
  namespaceSelector:
    matchNames:
      - immich
  selector:
    matchLabels:
      app.kubernetes.io/component: microservices
      app.kubernetes.io/name: immich

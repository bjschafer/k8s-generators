apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: immich-server
  namespace: immich
spec:
  endpoints:
    - port: metrics
  namespaceSelector:
    matchNames:
      - immich
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/name: immich

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: immich
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/immich/db-creds
        metadataPolicy: None
        property: DB_PASSWORD
      secretKey: DB_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: db-creds

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-exporter
  namespace: metrics-exporters
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/metrics-exporters/unifi-exporter
        metadataPolicy: None
        property: UP_UNIFI_DEFAULT_PASS
      secretKey: UP_UNIFI_DEFAULT_PASS
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: unifi-exporter

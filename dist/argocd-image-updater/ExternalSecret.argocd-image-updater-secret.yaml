apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-secret
  namespace: argocd
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: ^password$
            target: webhook.harbor-secret
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: argocd-image-updater-secret-webhook.harbor-secret
  refreshInterval: "0"
  target:
    name: argocd-image-updater-secret
    template:
      data:
        webhook.harbor-secret: '{{ index . "webhook.harbor-secret" }}'

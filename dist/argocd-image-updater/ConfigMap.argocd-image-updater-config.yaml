apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: argocd-image-updater
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: argocd-image-updater
    app.kubernetes.io/version: v1.5.0
    control-plane: argocd-image-updater-controller
    helm.sh/chart: argocd-image-updater-1.5.0
  name: argocd-image-updater-config
  namespace: argocd
data:
  disable-tls: "true"
  git.commit-message-template: ""
  git.commit-sign-off: "false"
  git.commit-signing-key: ""
  git.commit-signing-method: ""
  git.email: ""
  git.user: ""
  interval: 1h
  kube.events: "false"
  log.format: json
  log.level: info
  webhook.enable: "true"
  webhook.port: "8082"

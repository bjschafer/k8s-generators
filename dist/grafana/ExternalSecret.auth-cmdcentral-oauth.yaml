apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-cmdcentral-oauth
  namespace: grafana
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/grafana/authentik
        metadataPolicy: None
        property: client_id
      secretKey: client_id
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/grafana/authentik
        metadataPolicy: None
        property: client_secret
      secretKey: client_secret
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: auth-cmdcentral-oauth

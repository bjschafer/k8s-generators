apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox-db-credentials
  namespace: homebox
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/_all/homebox-db-credentials
        metadataPolicy: None
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: homebox-db-credentials

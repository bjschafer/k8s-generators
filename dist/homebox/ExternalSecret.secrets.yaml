apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: homebox
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/homebox/secrets
        metadataPolicy: None
        property: HBOX_OIDC_CLIENT_SECRET
      secretKey: HBOX_OIDC_CLIENT_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: secrets

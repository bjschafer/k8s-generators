apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spoolman-creds
  namespace: spoolman
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/spoolman/spoolman-creds
        metadataPolicy: None
        property: SPOOLMAN_DB_PASSWORD
      secretKey: SPOOLMAN_DB_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: spoolman-creds

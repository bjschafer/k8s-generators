apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: atuin
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/atuin/db-creds
        metadataPolicy: None
        property: ATUIN_DB_URI
      secretKey: ATUIN_DB_URI
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: db-creds

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: pfapi
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/pfapi/db-creds
        metadataPolicy: None
        property: Database_Database
      secretKey: Database_Database
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/pfapi/db-creds
        metadataPolicy: None
        property: Database_Host
      secretKey: Database_Host
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/pfapi/db-creds
        metadataPolicy: None
        property: Database_Password
      secretKey: Database_Password
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/pfapi/db-creds
        metadataPolicy: None
        property: Database_Port
      secretKey: Database_Port
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/pfapi/db-creds
        metadataPolicy: None
        property: Database_Type
      secretKey: Database_Type
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/pfapi/db-creds
        metadataPolicy: None
        property: Database_Username
      secretKey: Database_Username
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: db-creds

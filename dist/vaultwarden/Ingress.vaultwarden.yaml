apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  labels:
    app.kubernetes.io/name: vaultwarden
    cmdcentral.xyz/external: "true"
  name: vaultwarden
  namespace: vaultwarden
spec:
  rules:
    - host: passwords.cmdcentral.xyz
      http:
        paths:
          - backend:
              service:
                name: vaultwarden
                port:
                  number: 8080
            path: /
            pathType: Prefix
    - host: vaultwarden.cmdcentral.xyz
      http:
        paths:
          - backend:
              service:
                name: vaultwarden
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - passwords.cmdcentral.xyz
        - vaultwarden.cmdcentral.xyz
      secretName: vaultwarden-tls

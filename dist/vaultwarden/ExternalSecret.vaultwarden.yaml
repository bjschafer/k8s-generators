apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/vaultwarden/authentik
        metadataPolicy: None
        property: client_id
      secretKey: SSO_CLIENT_ID
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/vaultwarden/authentik
        metadataPolicy: None
        property: client_secret
      secretKey: SSO_CLIENT_SECRET
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/vaultwarden/vaultwarden
        metadataPolicy: None
        property: ADMIN_TOKEN
      secretKey: ADMIN_TOKEN
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/vaultwarden/vaultwarden
        metadataPolicy: None
        property: PUSH_INSTALLATION_ID
      secretKey: PUSH_INSTALLATION_ID
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/vaultwarden/vaultwarden
        metadataPolicy: None
        property: PUSH_INSTALLATION_KEY
      secretKey: PUSH_INSTALLATION_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vaultwarden

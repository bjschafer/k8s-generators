apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: generators
    app.kubernetes.io/name: external-dns-technitium
  name: external-dns-technitium
  namespace: external-dns
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: technitium-technitium-deployment-c80b7dbc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns-technitium
        cdk8s.io/metadata.addr: technitium-technitium-deployment-c80b7dbc
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - --source=service
            - --source=ingress
            - --source=traefik-proxy
            - --interval=30s
            - --policy=sync
            - --annotation-prefix=external-dns.kubernetes.io/
            - --provider=rfc2136
            - --rfc2136-host=10.0.10.100
            - --rfc2136-port=53
            - --rfc2136-zone=cmdcentral.xyz
            - --domain-filter=cmdcentral.xyz
            - --rfc2136-tsig-keyname=external-dns
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-axfr
            - --rfc2136-min-ttl=300s
            - --txt-owner-id=prod-k8s-external-dns
          env:
            - name: TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  key: tsig-secret
                  name: external-dns-technitium
          image: registry.k8s.io/external-dns/external-dns:v0.24.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 4
            httpGet:
              path: /healthz
              port: 7979
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
          name: external-dns-technitium
          readinessProbe:
            failureThreshold: 4
            httpGet:
              path: /healthz
              port: 7979
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsNonRoot: false
      serviceAccountName: external-dns
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30

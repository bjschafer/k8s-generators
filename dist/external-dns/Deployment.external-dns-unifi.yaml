apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-unifi
  namespace: external-dns
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: unifi-deployment-c8fcc8bc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        cdk8s.io/metadata.addr: unifi-deployment-c8fcc8bc
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - --source=service
            - --source=ingress
            - --source=traefik-proxy
            - --interval=30s
            - --policy=sync
            - --annotation-prefix=external-dns.kubernetes.io/
            - --provider=webhook
            - --webhook-provider-url=http://localhost:8888
            - --webhook-provider-read-timeout=50s
            - --txt-owner-id=prod-k8s-unifi
          image: registry.k8s.io/external-dns/external-dns:v0.23.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 4
            httpGet:
              path: /healthz
              port: 7979
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
          name: external-dns
          readinessProbe:
            failureThreshold: 4
            httpGet:
              path: /healthz
              port: 7979
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
        - env:
            - name: UNIFI_HOST
              value: https://10.0.10.1
            - name: UNIFI_SKIP_TLS_VERIFY
              value: "true"
            - name: UNIFI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: UNIFI_API_KEY
                  name: external-dns-unifi
          image: ghcr.io/home-operations/external-dns-unifi-webhook:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
          name: unifi-webhook
          ports:
            - containerPort: 8888
              name: webhook
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsNonRoot: false
      serviceAccountName: external-dns
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30

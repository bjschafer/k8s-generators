apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-pdns
  namespace: external-dns
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/external-dns/external-dns-pdns
        metadataPolicy: None
        property: api-key
      secretKey: api-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: external-dns-pdns

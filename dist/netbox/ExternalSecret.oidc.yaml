apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc
  namespace: netbox
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/netbox/authentik
        metadataPolicy: None
        property: client_id
      secretKey: SOCIAL_AUTH_OIDC_KEY
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/netbox/authentik
        metadataPolicy: None
        property: client_secret
      secretKey: SOCIAL_AUTH_OIDC_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: oidc

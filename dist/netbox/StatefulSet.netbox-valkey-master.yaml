apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: master
    app.kubernetes.io/instance: netbox
    app.kubernetes.io/name: valkey
  name: netbox-valkey-master
  namespace: netbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: master
      app.kubernetes.io/instance: netbox
      app.kubernetes.io/name: valkey
  serviceName: netbox-valkey-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/component: master
        app.kubernetes.io/instance: netbox
        app.kubernetes.io/name: valkey
        velero.io/exclude-from-backup: "true"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: master
                    app.kubernetes.io/instance: netbox
                    app.kubernetes.io/name: valkey
                namespaces:
                  - netbox
                topologyKey: kubernetes.io/hostname
              weight: 1
      containers:
        - args:
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --appendonly
            - "yes"
            - --save
            - ""
          command:
            - valkey-server
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: VALKEY_PASSWORD
                  name: netbox-valkey-auth
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  key: VALKEY_PASSWORD
                  name: netbox-valkey-auth
          image: ghcr.io/valkey-io/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            failureThreshold: 5
            initialDelaySeconds: 20
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 6
          name: valkey
          ports:
            - containerPort: 6379
              name: valkey
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            failureThreshold: 5
            initialDelaySeconds: 20
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 2
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /data
              name: valkey-data
      securityContext:
        fsGroup: 999
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: valkey-data
  updateStrategy:
    rollingUpdate: {}
    type: RollingUpdate

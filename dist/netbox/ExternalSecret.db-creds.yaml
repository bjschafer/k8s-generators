apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: netbox
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/netbox/db-creds
        metadataPolicy: None
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: db-creds

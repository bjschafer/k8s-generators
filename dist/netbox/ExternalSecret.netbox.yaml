apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox
  namespace: netbox
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/netbox/netbox
        metadataPolicy: None
        property: SECRET_KEY
      secretKey: SECRET_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netbox

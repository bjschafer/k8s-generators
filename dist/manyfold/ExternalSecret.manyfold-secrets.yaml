apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manyfold-secrets
  namespace: manyfold
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/manyfold/manyfold-secrets
        metadataPolicy: None
        property: SECRET_KEY_BASE
      secretKey: SECRET_KEY_BASE
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: manyfold-secrets

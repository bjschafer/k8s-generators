apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manyfold-valkey-auth
  namespace: manyfold
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: ^password$
            target: valkey-password
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: manyfold-valkey-auth-valkey-password
  refreshInterval: "0"
  target:
    name: manyfold-valkey-auth
    template:
      data:
        VALKEY_PASSWORD: '{{ index . "valkey-password" }}'

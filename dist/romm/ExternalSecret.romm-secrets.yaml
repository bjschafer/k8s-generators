apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-secrets
  namespace: romm
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/romm/authentik
        metadataPolicy: None
        property: client_secret
      secretKey: OIDC_CLIENT_SECRET
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/romm/romm-secrets
        metadataPolicy: None
        property: ROMM_AUTH_SECRET_KEY
      secretKey: ROMM_AUTH_SECRET_KEY
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/romm/romm-secrets
        metadataPolicy: None
        property: STEAMGRIDDB_API_KEY
      secretKey: STEAMGRIDDB_API_KEY
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/romm/romm-secrets
        metadataPolicy: None
        property: IGDB_CLIENT_ID
      secretKey: IGDB_CLIENT_ID
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/romm/romm-secrets
        metadataPolicy: None
        property: IGDB_CLIENT_SECRET
      secretKey: IGDB_CLIENT_SECRET
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/romm/romm-secrets
        metadataPolicy: None
        property: RETROACHIEVEMENTS_API_KEY
      secretKey: RETROACHIEVEMENTS_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: romm-secrets

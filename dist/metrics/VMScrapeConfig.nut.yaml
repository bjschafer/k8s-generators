apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: nut
  namespace: metrics
spec:
  path: /ups_metrics
  relabelConfigs:
    - action: replace
      sourceLabels:
        - ups
      targetLabel: __param_ups
  staticConfigs:
    - labels:
        job: nut
        ups: a-side
      targets:
        - infra2.cmdcentral.xyz:9199
    - labels:
        job: nut
        ups: b-side
      targets:
        - infra2.cmdcentral.xyz:9199

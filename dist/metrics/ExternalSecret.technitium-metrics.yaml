apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: technitium-metrics
  namespace: metrics
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/metrics/technitium-metrics
        metadataPolicy: None
        property: token
      secretKey: token
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: technitium-metrics

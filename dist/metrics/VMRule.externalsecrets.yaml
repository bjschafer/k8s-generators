apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    alerts.cmdcentral.xyz/kind: metrics
  name: externalsecrets
  namespace: metrics
spec:
  groups:
    - name: externalsecrets
      rules:
        - alert: ExternalSecretSyncFailed
          annotations:
            summary: ExternalSecret {{ $labels.name }} in {{ $labels.exported_namespace }} failed to sync
          expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 15m
          labels:
            namespace: metrics
            priority: "0"
            push_notify: "true"

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    alerts.cmdcentral.xyz/kind: metrics
  name: ups
  namespace: metrics
spec:
  groups:
    - name: ups
      rules:
        - alert: UpsOnBattery
          annotations:
            summary: UPS {{ $labels.ups }} is running on battery!
          expr: network_ups_tools_ups_status{flag='OB'} == 1
          for: 0m
          labels:
            priority: "1"
            push_notify: "true"
        - alert: UpsLowBattery
          annotations:
            summary: UPS {{ $labels.ups }} battery is below 50% ({{ $value }})
          expr: network_ups_tools_battery_charge < 50
          for: 1m
          labels:
            priority: "1"
            push_notify: "true"
        - alert: UpsHighLoad
          annotations:
            description: |-
              UPS load on {{ $labels.ups }}
                VALUE = {{ $value }}
                LABELS = {{ $labels }}
            summary: UPS load over 75% on UPS {{ $labels.ups }}
          expr: network_ups_tools_ups_load > 75
          for: 5m
          labels:
            priority: "0"
        - alert: UpsBatteryReplacementNeeded
          annotations:
            summary: UPS {{ $labels.ups }} reports that its battery needs replacing
          expr: network_ups_tools_ups_status{flag='RB'} == 1
          for: 1h
          labels:
            priority: "-1"

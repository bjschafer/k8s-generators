apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secrets
  namespace: metrics
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/_all/pushover-user-key
        metadataPolicy: None
        property: value
      secretKey: pushover_user_key
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/metrics/alertmanager-secrets
        metadataPolicy: None
        property: email_pass
      secretKey: email_pass
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/metrics/alertmanager-secrets
        metadataPolicy: None
        property: pushover_token
      secretKey: pushover_token
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/metrics/alertmanager-secrets
        metadataPolicy: None
        property: telegram_bot_token
      secretKey: telegram_bot_token
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-secrets

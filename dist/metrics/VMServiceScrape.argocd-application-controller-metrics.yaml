apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: argocd-application-controller-metrics
  namespace: metrics
spec:
  endpoints:
    - port: http-metrics
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/component: application-controller
      app.kubernetes.io/part-of: argocd

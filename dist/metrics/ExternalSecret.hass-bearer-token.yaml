apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-bearer-token
  namespace: metrics
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/metrics/hass-bearer-token
        metadataPolicy: None
        property: token
      secretKey: token
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hass-bearer-token

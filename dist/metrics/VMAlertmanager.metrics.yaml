apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: metrics
  namespace: metrics
spec:
  disableNamespaceMatcher: true
  disableRouteContinueEnforce: true
  externalURL: https://alertmanager.cmdcentral.xyz
  resources:
    limits:
      memory: 192Mi
    requests:
      memory: 96Mi
  selectAllByDefault: true

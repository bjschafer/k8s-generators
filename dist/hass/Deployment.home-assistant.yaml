apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: generators
    app.kubernetes.io/name: home-assistant
  name: home-assistant
  namespace: hass
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: home-assistant-app-home-assistant-app-deployment-c8e0db23
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
        cdk8s.io/metadata.addr: home-assistant-app-home-assistant-app-deployment-c8e0db23
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: HASS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: hass-db-credentials
            - name: HASS_DB_URL
              value: postgresql://hass:$(HASS_DB_PASSWORD)@pg-prod.cmdcentral.xyz/hass
          image: ghcr.io/home-assistant/home-assistant
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            tcpSocket:
              port: 8123
          name: home-assistant
          ports:
            - containerPort: 8123
          readinessProbe:
            failureThreshold: 3
            tcpSocket:
              port: 8123
          resources:
            limits:
              memory: 2048Mi
            requests:
              cpu: 100m
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            periodSeconds: 5
            tcpSocket:
              port: 8123
          volumeMounts:
            - mountPath: /config
              name: pvc-config
        - env:
            - name: TZ
              value: America/Chicago
            - name: PORT
              value: "5580"
            - name: LISTEN_ADDRESS
              value: 127.0.0.1,::1
          image: ghcr.io/matter-js/matterjs-server:stable
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck.sh
            failureThreshold: 6
            periodSeconds: 60
            timeoutSeconds: 10
          name: matter-server
          resources:
            limits:
              memory: 1024Mi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck.sh
            failureThreshold: 180
            periodSeconds: 5
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /data
              name: pvc-matter-server
      dnsConfig:
        nameservers:
          - 10.0.10.100
          - 10.0.10.101
        searches:
          - cmdcentral.xyz
      dnsPolicy: ClusterFirst
      hostNetwork: true
      initContainers:
        - command:
            - chown
            - -R
            - 1000:1000
            - /data
          image: ghcr.io/matter-js/matterjs-server:stable
          imagePullPolicy: IfNotPresent
          name: matter-server-chown
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /data
              name: pvc-matter-server
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsNonRoot: false
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: pvc-config
          persistentVolumeClaim:
            claimName: config
            readOnly: false
        - name: pvc-matter-server
          persistentVolumeClaim:
            claimName: matter-server
            readOnly: false

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: csi-rbd-secret
  namespace: ceph
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/ceph/csi-rbd-secret
        metadataPolicy: None
        property: adminID
      secretKey: adminID
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/ceph/csi-rbd-secret
        metadataPolicy: None
        property: adminKey
      secretKey: adminKey
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/ceph/csi-rbd-secret
        metadataPolicy: None
        property: userID
      secretKey: userID
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/ceph/csi-rbd-secret
        metadataPolicy: None
        property: userKey
      secretKey: userKey
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: csi-rbd-secret

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: bambuddy
  namespace: bambuddy
spec:
  endpoints:
    - path: /api/v1/metrics
      port: http
  namespaceSelector:
    matchNames:
      - bambuddy
  selector:
    matchLabels:
      app.kubernetes.io/name: bambuddy

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-creds
  namespace: mealie
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/mealie/authentik
        metadataPolicy: None
        property: client_secret
      secretKey: OIDC_CLIENT_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: oidc-creds

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: generators
    app.kubernetes.io/name: cmdcentralbot
  name: cmdcentralbot
  namespace: cmdcentralbot
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: cmdcentralbot-app-cmdcentralbot-app-deployment-c83b5c35
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmdcentralbot
        cdk8s.io/metadata.addr: cmdcentralbot-app-cmdcentralbot-app-deployment-c83b5c35
    spec:
      automountServiceAccountToken: true
      containers:
        - envFrom:
            - secretRef:
                name: bot-token
          image: ghcr.io/bjschafer/cmdcentralbot:main
          imagePullPolicy: Always
          name: cmdcentralbot
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
      dnsConfig:
        nameservers:
          - 10.0.10.100
          - 10.0.10.101
        searches:
          - cmdcentral.xyz
      dnsPolicy: None
      hostNetwork: false
      imagePullSecrets:
        - name: github-registry-cred
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsNonRoot: false
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30

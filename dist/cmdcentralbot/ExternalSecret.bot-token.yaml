apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bot-token
  namespace: cmdcentralbot
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/cmdcentralbot/bot-token
        metadataPolicy: None
        property: BOT_TOKEN
      secretKey: BOT_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: bot-token

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    alerts.cmdcentral.xyz/kind: logs
  name: logs
  namespace: logs
spec:
  groups:
    - name: logs
      rules:
        - alert: HostFilesystemReadonly
          annotations:
            summary: Filesystem on host {{ $labels.hostname }} is read-only, probable longhorn issue
          expr: hostname:"k8s" AND job:"systemd-journal" AND "Remounting filesystem read-only" | stats by (hostname) count(*) logs_count | filter logs_count:>0
          for: 0m
          labels:
            priority: "0"
            push_notify: "true"
            severity: critical
        - alert: ContainerCpuArchUnsupported
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.container }} image requires a newer x86-64 microarch level than the hosts support -- pin the previous image"
          expr: '"CPU does not support x86-64" | stats by (kubernetes.pod_namespace, kubernetes.container_name) count(*) logs_count | filter logs_count:>0 | rename kubernetes.pod_namespace as namespace, kubernetes.container_name as container'
          for: 0m
          labels:
            priority: "0"
            push_notify: "true"
            severity: critical
      type: vlogs

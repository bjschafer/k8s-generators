apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vlogs-auth-keys
  namespace: logs
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: ^password$
            target: admin-auth-key
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: vlogs-auth-keys-admin-auth-key
  refreshInterval: "0"
  target:
    name: vlogs-auth-keys
    template:
      data:
        ADMIN_AUTH_KEY: '{{ index . "admin-auth-key" }}'

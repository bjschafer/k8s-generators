apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smtp
  namespace: smtp
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/_all/cloudflare-smtp-password
        metadataPolicy: None
        property: value
      secretKey: RELAYHOST_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: smtp

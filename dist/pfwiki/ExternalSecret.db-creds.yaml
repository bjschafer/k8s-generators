apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: pfwiki
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/pfwiki/db-creds
        metadataPolicy: None
        property: MARIADB_ROOT_PASSWORD
      secretKey: MARIADB_ROOT_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: db-creds

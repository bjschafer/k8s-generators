apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  labels:
    app: reloader
  name: reloader
  namespace: reloader
spec:
  jobLabel: reloader
  namespaceSelector:
    matchNames:
      - reloader
  podMetricsEndpoints:
    - path: /metrics
      port: http
  selector:
    matchLabels:
      app: reloader

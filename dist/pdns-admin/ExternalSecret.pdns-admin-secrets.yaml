apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pdns-admin-secrets
  namespace: pdns-admin
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: ^password$
            target: secret-key
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pdns-admin-secrets-secret-key
  refreshInterval: "0"
  target:
    name: pdns-admin-secrets
    template:
      data:
        SECRET_KEY: '{{ index . "secret-key" }}'

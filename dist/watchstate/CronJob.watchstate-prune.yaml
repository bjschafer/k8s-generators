apiVersion: batch/v1
kind: CronJob
metadata:
  name: watchstate-prune
  namespace: watchstate
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            cdk8s.io/metadata.addr: watchstate-prune-prune-cronjob-c842b659
        spec:
          automountServiceAccountToken: true
          containers:
            - args:
                - exec
                - -n
                - watchstate
                - deploy/watchstate
                - --
                - sh
                - -c
                - |-
                  rc=0
                  for p in file_pruner database_pruner backend_metadata command_sessions media_health_reports; do
                    echo "==> $p"
                    console system:prune --run --execute -p "$p" -v || rc=1
                  done
                  exit $rc
              command:
                - kubectl
              image: rancher/kubectl:v1.36.3
              imagePullPolicy: IfNotPresent
              name: prune
              resources:
                limits:
                  memory: 128Mi
                requests:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: false
                runAsNonRoot: false
          dnsPolicy: ClusterFirst
          hostNetwork: false
          restartPolicy: OnFailure
          securityContext:
            fsGroupChangePolicy: Always
            runAsNonRoot: false
          serviceAccountName: watchstate-pruner
          setHostnameAsFQDN: false
          shareProcessNamespace: false
          terminationGracePeriodSeconds: 30
  schedule: 0 */6 * * *
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  suspend: false

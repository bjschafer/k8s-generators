apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/name: calibre
  name: calibre
  namespace: argocd
spec:
  destination:
    namespace: calibre
    server: https://kubernetes.default.svc
  project: default
  source:
    path: dist/calibre
    repoURL: git@github.com:bjschafer/k8s-generators.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  labels:
    app.kubernetes.io/name: calibre
  name: calibre-updater
  namespace: argocd
spec:
  applicationRefs:
    - images:
        - alias: calibre
          commonUpdateSettings:
            updateStrategy: semver
          imageName: lscr.io/linuxserver/calibre:9.x
      namePattern: calibre
  writeBackConfig:
    gitConfig:
      branch: main
    method: git

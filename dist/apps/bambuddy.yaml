apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/name: bambuddy
  name: bambuddy
  namespace: argocd
spec:
  destination:
    namespace: bambuddy
    server: https://kubernetes.default.svc
  project: default
  source:
    path: dist/bambuddy
    repoURL: git@github.com:bjschafer/k8s-generators.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  labels:
    app.kubernetes.io/name: bambuddy
  name: bambuddy-updater
  namespace: argocd
spec:
  applicationRefs:
    - images:
        - alias: bambuddy
          commonUpdateSettings:
            updateStrategy: digest
          imageName: ghcr.io/maziggy/bambuddy:latest
      namePattern: bambuddy
  writeBackConfig:
    gitConfig:
      branch: main
    method: git

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/name: bookorbit
  name: bookorbit
  namespace: argocd
spec:
  destination:
    namespace: bookorbit
    server: https://kubernetes.default.svc
  project: default
  source:
    path: dist/bookorbit
    repoURL: git@github.com:bjschafer/k8s-generators.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  labels:
    app.kubernetes.io/name: bookorbit
  name: bookorbit-updater
  namespace: argocd
spec:
  applicationRefs:
    - images:
        - alias: bookorbit
          commonUpdateSettings:
            updateStrategy: semver
          imageName: ghcr.io/bookorbit/bookorbit:2.x
      namePattern: bookorbit
  writeBackConfig:
    gitConfig:
      branch: main
    method: git

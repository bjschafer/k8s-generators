apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/name: catbot
  name: catbot
  namespace: argocd
spec:
  destination:
    namespace: catbot
    server: https://kubernetes.default.svc
  project: default
  source:
    path: dist/catbot
    repoURL: git@github.com:bjschafer/k8s-generators.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  labels:
    app.kubernetes.io/name: catbot
  name: catbot-updater
  namespace: argocd
spec:
  applicationRefs:
    - images:
        - alias: catbot
          commonUpdateSettings:
            pullSecret: pullsecret:catbot/github-registry-cred
            updateStrategy: digest
          imageName: ghcr.io/bjschafer/catbot:main
      namePattern: catbot
  writeBackConfig:
    gitConfig:
      branch: main
    method: git

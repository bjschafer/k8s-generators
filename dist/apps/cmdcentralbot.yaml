apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/name: cmdcentralbot
  name: cmdcentralbot
  namespace: argocd
spec:
  destination:
    namespace: cmdcentralbot
    server: https://kubernetes.default.svc
  project: default
  source:
    path: dist/cmdcentralbot
    repoURL: git@github.com:bjschafer/k8s-generators.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  labels:
    app.kubernetes.io/name: cmdcentralbot
  name: cmdcentralbot-updater
  namespace: argocd
spec:
  applicationRefs:
    - images:
        - alias: cmdcentralbot
          commonUpdateSettings:
            pullSecret: pullsecret:cmdcentralbot/github-registry-cred
            updateStrategy: digest
          imageName: ghcr.io/bjschafer/cmdcentralbot:main
      namePattern: cmdcentralbot
  writeBackConfig:
    gitConfig:
      branch: main
    method: git

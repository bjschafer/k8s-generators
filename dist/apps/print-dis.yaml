apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/name: print-dis
  name: print-dis
  namespace: argocd
spec:
  destination:
    namespace: print-dis
    server: https://kubernetes.default.svc
  project: default
  source:
    path: dist/print-dis
    repoURL: git@github.com:bjschafer/k8s-generators.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  labels:
    app.kubernetes.io/name: print-dis
  name: print-dis-updater
  namespace: argocd
spec:
  applicationRefs:
    - images:
        - alias: print-dis
          commonUpdateSettings:
            updateStrategy: digest
          imageName: ghcr.io/bjschafer/print-dis:main
      namePattern: print-dis
  writeBackConfig:
    gitConfig:
      branch: main
    method: git

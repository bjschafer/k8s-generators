apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/name: stlquest
  name: stlquest
  namespace: argocd
spec:
  destination:
    namespace: stlquest
    server: https://kubernetes.default.svc
  project: default
  source:
    path: dist/stlquest
    repoURL: git@github.com:bjschafer/k8s-generators.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  labels:
    app.kubernetes.io/name: stlquest
  name: stlquest-updater
  namespace: argocd
spec:
  applicationRefs:
    - images:
        - alias: stl.quest
          commonUpdateSettings:
            updateStrategy: digest
          imageName: ghcr.io/richardsolomou/stl.quest:latest
      namePattern: stlquest
  writeBackConfig:
    gitConfig:
      branch: main
    method: git

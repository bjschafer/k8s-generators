apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/name: stlquest
  name: stlquest
  namespace: argocd
spec:
  destination:
    namespace: stlquest
    server: https://kubernetes.default.svc
  project: default
  source:
    path: dist/stlquest
    repoURL: git@github.com:bjschafer/k8s-generators.git
    targetRevision: main
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

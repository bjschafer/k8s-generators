apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  name: stlquest
  namespace: stlquest
spec:
  rules:
    - host: prints.cmdcentral.xyz
      http:
        paths:
          - backend:
              service:
                name: stlquest
                port:
                  number: 3000
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - prints.cmdcentral.xyz
      secretName: stlquest-tls

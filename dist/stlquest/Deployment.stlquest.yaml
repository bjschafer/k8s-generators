apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: generators
    app.kubernetes.io/name: stlquest
  name: stlquest
  namespace: stlquest
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: stlquest-stlquest-deployment-c85ba516
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stlquest
        cdk8s.io/metadata.addr: stlquest-stlquest-deployment-c85ba516
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: stlquest-db-credentials
            - name: DATABASE_URL
              value: postgresql://stlquest:$(DB_PASSWORD)@prod.postgres.svc.cluster.local:5432/stlquest
            - name: ASSET_WORKER_CONCURRENCY
              value: "2"
            - name: ASSET_WORKER_MEMORY_MB
              value: "1024"
          image: ghcr.io/richardsolomou/stl.quest:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
          name: stlquest
          ports:
            - containerPort: 3000
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
          resources:
            limits:
              cpu: "2"
              memory: 2048Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 36
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            periodSeconds: 5
          volumeMounts:
            - mountPath: /data
              name: pvc-data
            - mountPath: /prints
              name: pvc-prints
            - mountPath: /tmp
              name: tmp
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: pvc-data
          persistentVolumeClaim:
            claimName: data
            readOnly: false
        - name: pvc-prints
          persistentVolumeClaim:
            claimName: prints
            readOnly: false
        - emptyDir: {}
          name: tmp

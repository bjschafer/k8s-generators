apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/master
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  tolerations:
    - effect: NoSchedule
      key: cmdcentral.xyz/critical
      operator: Exists
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
    - effect: NoExecute
      key: k3s-controlplane
      operator: Exists
  upgrade:
    image: rancher/k3s-upgrade
  version: v1.36.3+k3s1

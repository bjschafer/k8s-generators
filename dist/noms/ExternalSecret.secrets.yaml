apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secrets
  namespace: noms
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/_all/cloudflare-account-id
        metadataPolicy: None
        property: value
      secretKey: CF_ACCOUNT_ID
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/_all/pushover-user-key
        metadataPolicy: None
        property: value
      secretKey: PUSHOVER_USER_KEY
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/noms/secrets
        metadataPolicy: None
        property: CF_API_TOKEN
      secretKey: CF_API_TOKEN
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/noms/secrets
        metadataPolicy: None
        property: BRAVE_API_KEY
      secretKey: BRAVE_API_KEY
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/noms/secrets
        metadataPolicy: None
        property: PUSHOVER_APP_TOKEN
      secretKey: PUSHOVER_APP_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: secrets

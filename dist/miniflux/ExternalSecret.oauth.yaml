apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth
  namespace: miniflux
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/miniflux/oauth
        metadataPolicy: None
        property: OAUTH2_CLIENT_ID
      secretKey: OAUTH2_CLIENT_ID
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/miniflux/oauth
        metadataPolicy: None
        property: OAUTH2_CLIENT_SECRET
      secretKey: OAUTH2_CLIENT_SECRET
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/miniflux/oauth
        metadataPolicy: None
        property: OAUTH2_OIDC_DISCOVERY_ENDPOINT
      secretKey: OAUTH2_OIDC_DISCOVERY_ENDPOINT
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/miniflux/oauth
        metadataPolicy: None
        property: OAUTH2_PROVIDER
      secretKey: OAUTH2_PROVIDER
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/miniflux/oauth
        metadataPolicy: None
        property: OAUTH2_REDIRECT_URL
      secretKey: OAUTH2_REDIRECT_URL
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/miniflux/oauth
        metadataPolicy: None
        property: OAUTH2_USER_CREATION
      secretKey: OAUTH2_USER_CREATION
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: oauth

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: miniflux
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/miniflux/db-creds
        metadataPolicy: None
        property: DATABASE_URL
      secretKey: DATABASE_URL
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: db-creds

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: energy-db-credentials
  namespace: energy
spec:
  data:
    - remoteRef:
        key: energy-db-credentials
        property: password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes
  target:
    name: energy-db-credentials

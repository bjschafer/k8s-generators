apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alliant-credentials
  namespace: energy
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/energy/alliant-credentials
        metadataPolicy: None
        property: ALLIANT_USERNAME
      secretKey: ALLIANT_USERNAME
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/energy/alliant-credentials
        metadataPolicy: None
        property: ALLIANT_PASSWORD
      secretKey: ALLIANT_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alliant-credentials

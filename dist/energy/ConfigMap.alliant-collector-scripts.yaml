apiVersion: v1
kind: ConfigMap
metadata:
  name: alliant-collector-scripts
  namespace: energy
data:
  alliant_fetch.py: |
    #!/usr/bin/env python3
    """Fetch electric usage from Alliant Energy's MyAccount API and write CSVs.

    Alliant's portal is a Smart Energy Water ("smartcmobile") deployment. The web UI
    drives a plain JSON API, so there is nothing to scrape and no browser needed:

      1. POST Login/auth -> accessToken (valid ~30 min)
      2. GET  Addresses/User/{uuid} -> account + premise numbers
      3. POST Usages/GetMeterAndPremise -> meter numbers
      4. GET  UsageAPI/api/V1/Electric -> usage at MO / DA / HH granularity

    Two quirks of that API are load-bearing here:

    * The `RecaptchaToken` header and the whole SendTfa/VerifyTfa dance are enforced
      only in the browser. The token minted by Login/auth -- before any 2FA -- is the
      same token that authorizes every data call, so this runs unattended.
    * `readDate` carries a nonsense `+01:00` offset. The values are really local wall
      time, so we emit naive local date/hour and let Postgres do the conversion. That
      keeps a tzdata dependency out of this image and, more importantly, keeps the
      local-day grouping exact across DST transitions.

    Output is CSV rather than direct SQL because the loader ingests via \\copy into a
    staging table: no string escaping, and therefore no injection surface from
    values we do not control.
    """

    from __future__ import annotations

    import csv
    import json
    import os
    import socket
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from datetime import date, datetime, timedelta, timezone
    from typing import Any, Iterable

    BASE = "https://alliant-svc.smartcmobile.com"

    # Cloudflare fronts this API and rejects requests that do not look like the
    # portal, so the portal's Origin/Referer/UA are required, not cosmetic.
    UA = "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:140.0) Gecko/20100101 Firefox/140.0"
    BASE_HEADERS = {
        "User-Agent": UA,
        "Accept": "application/json, text/plain, */*",
        "Origin": "https://myaccount.alliantenergy.com",
        "Referer": "https://myaccount.alliantenergy.com/",
    }

    # Earliest date worth asking for. The API simply returns nothing before service
    # start, so an over-wide floor is free -- it just makes backfill self-healing.
    DEFAULT_START = "2024-01-01"

    TIMEOUT = 60
    RETRIES = 4


    def log(msg: str) -> None:
        print(msg, flush=True)


    def request(
        method: str,
        path: str,
        *,
        body: Any = None,
        headers: dict[str, str] | None = None,
        params: dict[str, str] | None = None,
    ) -> Any:
        url = BASE + path
        if params:
            url += "?" + urllib.parse.urlencode(params)

        hdrs = dict(BASE_HEADERS)
        hdrs.update(headers or {})
        data = None
        if body is not None:
            data = json.dumps(body).encode()
            hdrs["Content-Type"] = "application/json"

        last: Exception | None = None
        for attempt in range(RETRIES):
            try:
                req = urllib.request.Request(url, data=data, headers=hdrs, method=method)
                with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                    return json.load(resp)
            except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
                # 4xx is a real answer (bad credentials, bad range) -- do not retry it.
                if isinstance(exc, urllib.error.HTTPError) and 400 <= exc.code < 500:
                    raise
                last = exc
                if attempt < RETRIES - 1:
                    backoff = 2**attempt
                    log(f"  request failed ({exc}); retrying in {backoff}s")
                    time.sleep(backoff)
        raise RuntimeError(f"{method} {path} failed after {RETRIES} attempts: {last}")


    def login(username: str, password: str) -> tuple[str, str]:
        """Return (accessToken, uuid). Deliberately skips 2FA -- see module docstring."""
        resp = request(
            "POST",
            "/UsermanagementAPI/api/1/Login/auth",
            body={
                "username": username,
                "password": password,
                "guestToken": "",
                "customattributes": {
                    "ip": "",
                    "client": "Web",
                    "version": "10.15",
                    "deviceId": "||Firefox||140||Mac OS X||10.15||",
                    "deviceName": "Firefox",
                    "deviceType": 0,
                    "os": "Mac OS X",
                },
            },
            headers={"ST": "PL", "uid": "1"},
        )
        status = resp.get("status", {})
        if status.get("error") or "data" not in resp:
            raise SystemExit(f"login failed: {status.get('message', resp)}")
        return resp["data"]["accessToken"], resp["data"]["user"]["uuid"]


    def usage(auth: dict[str, str], account: str, meter: str, frm: str, to: str, per: str) -> list[dict]:
        resp = request(
            "GET",
            "/UsageAPI/api/V1/Electric",
            headers=auth,
            params={
                "AccountNumber": account,
                "MeterNumber": meter,
                "From": frm,
                "To": to,
                "Uom": "kWh",
                "Periodicity": per,
            },
        )
        return (resp.get("Result") or {}).get("electricUsages") or []


    def hour_start(read_date: str) -> tuple[str, int]:
        """Map an hour-*ending* label to (local_date, hour-beginning 0-23).

        Alliant labels each interval by the hour it ends: 01:00 is midnight->1am.
        Storing by period start is both what Grafana bar charts read naturally and
        what Home Assistant statistics expect, so shift back one hour here.

        Midnight is the trap. 24:00 arrives as 00:00 of the *following* date, so it
        closes the previous day rather than opening this one -- the date has to roll
        back with the hour. Getting this wrong is nearly invisible: every day still
        has 24 rows and the yearly total still balances, because each day simply
        borrows its 23:00 hour from the day before. It shows up only when a day's
        hours are summed and compared against the daily series, which disagreed by
        up to 6 kWh before this rolled the date back.
        """
        day, clock = read_date[:10], read_date[11:13]
        hour = int(clock)
        if hour >= 1:
            return day, hour - 1
        return (date.fromisoformat(day) - timedelta(days=1)).isoformat(), 23


    def tou(row: dict) -> tuple[str, str]:
        """Time-of-use tier and rate plan, normalised to '' rather than None.

        Both are empty on a flat-rate account. They are carried anyway because the
        account is moving to time-of-use billing and Alliant would not commit to a
        date -- capturing them now means the tiers are simply there when they start
        arriving, instead of being silently dropped until someone notices.

        '' rather than NULL because these are part of the primary key downstream,
        and NULL cannot be.
        """
        return (row.get("tierTou") or "", row.get("ratePlan") or "")


    def collect(auth: dict[str, str], account: str, meter: str, start: str, end: str):
        """Fetch all three granularities for one meter.

        The whole history comes back in one request per granularity (~12k hourly rows
        for 17 months), so there is no paging and no incremental state to corrupt --
        every run re-fetches everything and upserts.
        """
        hourly: dict[tuple[str, int, str], tuple[float, str]] = {}
        # Duplicate hour rows appear on days the utility re-read the meter. They are
        # byte-identical repeats, so last-wins is right; summing them double-counts
        # (verified against the daily series: dedup matches to 0.04% over 17 months,
        # keeping duplicates overshoots by ~78 kWh).
        #
        # The tier is part of the key: under time-of-use an hour may legitimately
        # come back as several rows, one per tier, and keying on the hour alone
        # would silently collapse them into whichever sorted last.
        dupes = 0
        for row in usage(auth, account, meter, f"{start} 00:00:01", f"{end} 00:00:00", "HH"):
            day, hour = hour_start(row["readDate"])
            tier, plan = tou(row)
            key = (day, hour, tier)
            if key in hourly:
                dupes += 1
            hourly[key] = (float(row["consumption"]), plan)

        daily: dict[tuple[str, str], tuple[float, str]] = {}
        for r in usage(auth, account, meter, start, end, "DA"):
            tier, plan = tou(r)
            daily[(r["readDate"][:10], tier)] = (float(r["consumption"]), plan)

        # Keyed like hourly and daily rather than accumulated into a list: a period
        # that comes back twice would otherwise reach the loader as two rows with
        # the same primary key, and since the load is one transaction that failure
        # takes the hourly and daily series down with it.
        billing: dict[tuple[str, str], dict] = {}
        for r in usage(auth, account, meter, start, end, "MO"):
            # Monthly rows are keyed by billing period; anything without a real
            # period is a placeholder row the portal ignores too.
            if not r.get("readingFrom", "").startswith("2"):
                continue
            period_start, period_end = r["readingFrom"][:10], r["readingTo"][:10]
            # Once a bill is issued Alliant emits a second, zero-length row for the
            # same period: readingTo == readingFrom, 0 kWh, but carrying the closed
            # period's amount. Dropping it is not just deduplication -- it collides
            # with the real row's key, and letting it win would be worse than the
            # crash it caused, since a period with 0 kWh prices at a NULL rate and
            # spans no days, silently erasing the newest bill from the tariff model.
            if period_end <= period_start:
                continue
            tier, plan = tou(r)
            billing[(period_start, tier)] = {
                "period_start": period_start,
                "period_end": period_end,
                "tier_tou": tier,
                "rate_plan": plan,
                "kwh": float(r["consumption"]),
                "amount_usd": float(r["amount"] or 0),
            }

        tiers = sorted(
            {k[2] for k in hourly} | {k[1] for k in daily} | {b["tier_tou"] for b in billing.values()}
        )
        log(
            f"  meter {meter}: {len(hourly)} hourly ({dupes} dupes dropped), "
            f"{len(daily)} daily, {len(billing)} billing | tou tiers seen: {tiers or ['(none)']}"
        )
        return hourly, daily, [billing[k] for k in sorted(billing)]


    def emit_freshness(newest_day: str) -> None:
        """Publish the newest day we have as a statsd gauge, for alerting.

        A *timestamp* rather than a lag on purpose: Prometheus derives the lag with
        `time() - alliant_last_data_timestamp_seconds`, which keeps growing even if
        this job stops running entirely. A lag gauge would freeze at its last value
        and quietly stop alerting in exactly the case that matters most.

        Fire-and-forget UDP -- statsd is not worth failing a good load over.
        """
        host = os.environ.get("STATSD_HOST")
        if not host:
            return
        port = int(os.environ.get("STATSD_PORT", "9125"))
        epoch = int(datetime.strptime(newest_day, "%Y-%m-%d").replace(tzinfo=timezone.utc).timestamp())
        try:
            with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as s:
                s.sendto(f"alliant_last_data_timestamp_seconds:{epoch}|g".encode(), (host, port))
            log(f"statsd: alliant_last_data_timestamp_seconds={epoch} ({newest_day}) -> {host}:{port}")
        except OSError as exc:
            log(f"statsd emit failed (ignored): {exc}")


    def write_csv(path: str, header: Iterable[str], rows: Iterable[Iterable]) -> int:
        n = 0
        with open(path, "w", newline="") as fh:
            w = csv.writer(fh)
            w.writerow(header)
            for row in rows:
                w.writerow(row)
                n += 1
        return n


    def main() -> int:
        username = os.environ["ALLIANT_USERNAME"]
        password = os.environ["ALLIANT_PASSWORD"]
        out_dir = os.environ.get("OUT_DIR", "/data")
        start = os.environ.get("ALLIANT_START_DATE", DEFAULT_START)
        # Data lags ~4 days behind real time; ask a week past today so the tail is
        # always included and late-arriving reads get corrected on the next run.
        end = (date.today() + timedelta(days=7)).isoformat()

        log(f"fetching {start} .. {end}")
        token, uuid = login(username, password)
        auth = {"Authorization": f"Bearer {token}", "uid": "2", "pt": "1"}
        log("authenticated (no 2FA required)")

        addresses = request("GET", f"/Services/api/1/Addresses/User/{uuid}", headers=auth).get("data") or []
        if not addresses:
            raise SystemExit("no accounts returned for this login")

        hourly_rows, daily_rows, billing_rows = [], [], []
        for addr in addresses:
            acct, premise = addr["accountNumber"], addr["premiseNumber"]
            log(f"account {acct} (premise {premise})")

            meters = request(
                "POST",
                "/Services/api/1/Usages/GetMeterAndPremise",
                body={"accountNumber": acct, "premiseNumber": premise},
                headers=auth,
            ).get("data") or []
            # The same meter is listed once per service period; usage is keyed by
            # meter number alone, so collapse them or we fetch identical data twice.
            for meter in sorted({m["meterNumber"] for m in meters}):
                # Usage endpoints want the composite "premise-account" form.
                hourly, daily, billing = collect(auth, f"{premise}-{acct}", meter, start, end)
                hourly_rows += [
                    (acct, meter, d, h, tier, plan, v) for (d, h, tier), (v, plan) in sorted(hourly.items())
                ]
                daily_rows += [(acct, meter, d, tier, plan, v) for (d, tier), (v, plan) in sorted(daily.items())]
                billing_rows += [
                    (
                        acct,
                        meter,
                        b["period_start"],
                        b["period_end"],
                        b["tier_tou"],
                        b["rate_plan"],
                        b["kwh"],
                        b["amount_usd"],
                    )
                    for b in billing
                ]

        if not hourly_rows:
            raise SystemExit("no hourly usage returned -- refusing to signal success")

        n_h = write_csv(
            f"{out_dir}/hourly.csv",
            ("account", "meter", "local_date", "hour_start", "tier_tou", "rate_plan", "kwh"),
            hourly_rows,
        )
        n_d = write_csv(
            f"{out_dir}/daily.csv",
            ("account", "meter", "local_date", "tier_tou", "rate_plan", "kwh"),
            daily_rows,
        )
        n_b = write_csv(
            f"{out_dir}/billing.csv",
            ("account", "meter", "period_start", "period_end", "tier_tou", "rate_plan", "kwh", "amount_usd"),
            billing_rows,
        )
        log(f"wrote {n_h} hourly, {n_d} daily, {n_b} billing rows to {out_dir}")

        emit_freshness(max(r[2] for r in daily_rows))
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  load.sql: |
    -- Load Alliant usage CSVs into Postgres. Run under psql --single-transaction:
    -- either the whole snapshot lands or none of it does.
    --
    -- The collector re-fetches all history every run, so this is written to be
    -- idempotent: staging tables + UPSERT, never DELETE-then-INSERT. A run that
    -- fetches a short window cannot erase history, and late-arriving meter reads
    -- correct themselves in place.

    CREATE TABLE IF NOT EXISTS hourly_usage (
      account    text             NOT NULL,
      meter      text             NOT NULL,
      -- local_date/hour_start are the real key, deliberately: they survive DST
      -- transitions unambiguously, where a bare instant does not. `ts` is derived
      -- for Grafana's benefit and is not authoritative.
      local_date date             NOT NULL,
      hour_start smallint         NOT NULL CHECK (hour_start BETWEEN 0 AND 23),
      -- Empty on a flat-rate account. In the key because under time-of-use one hour
      -- can return several rows, one per tier, and keying on the hour alone would
      -- collapse them. '' not NULL, since a key column cannot be NULL.
      tier_tou   text             NOT NULL DEFAULT '',
      rate_plan  text             NOT NULL DEFAULT '',
      kwh        double precision NOT NULL,
      ts         timestamptz      NOT NULL,
      updated_at timestamptz      NOT NULL DEFAULT now(),
      PRIMARY KEY (account, meter, local_date, hour_start, tier_tou)
    );
    CREATE INDEX IF NOT EXISTS hourly_usage_ts_idx ON hourly_usage (ts);

    CREATE TABLE IF NOT EXISTS daily_usage (
      account    text             NOT NULL,
      meter      text             NOT NULL,
      local_date date             NOT NULL,
      tier_tou   text             NOT NULL DEFAULT '',
      rate_plan  text             NOT NULL DEFAULT '',
      kwh        double precision NOT NULL,
      updated_at timestamptz      NOT NULL DEFAULT now(),
      PRIMARY KEY (account, meter, local_date, tier_tou)
    );

    -- One row per billing period. `amount_usd` is what makes cost analysis possible
    -- at all; the hourly feed carries no price.
    CREATE TABLE IF NOT EXISTS billing_period (
      account      text             NOT NULL,
      meter        text             NOT NULL,
      period_start date             NOT NULL,
      period_end   date             NOT NULL,
      tier_tou     text             NOT NULL DEFAULT '',
      rate_plan    text             NOT NULL DEFAULT '',
      kwh          double precision NOT NULL,
      amount_usd   double precision NOT NULL,
      updated_at   timestamptz      NOT NULL DEFAULT now(),
      PRIMARY KEY (account, meter, period_start, tier_tou)
    );

    CREATE TABLE IF NOT EXISTS collector_run (
      id          bigserial PRIMARY KEY,
      ran_at      timestamptz NOT NULL DEFAULT now(),
      hourly_rows integer     NOT NULL,
      daily_rows  integer     NOT NULL,
      billing_rows integer    NOT NULL
    );

    -- Migration for databases created before the time-of-use columns existed. The
    -- CREATE TABLE statements above only fire on an empty database, so bringing an
    -- existing one forward has to be explicit. Idempotent, so it is safe to leave
    -- here permanently rather than running it once by hand and forgetting why.
    ALTER TABLE hourly_usage   ADD COLUMN IF NOT EXISTS tier_tou  text NOT NULL DEFAULT '';
    ALTER TABLE hourly_usage   ADD COLUMN IF NOT EXISTS rate_plan text NOT NULL DEFAULT '';
    ALTER TABLE daily_usage    ADD COLUMN IF NOT EXISTS tier_tou  text NOT NULL DEFAULT '';
    ALTER TABLE daily_usage    ADD COLUMN IF NOT EXISTS rate_plan text NOT NULL DEFAULT '';
    ALTER TABLE billing_period ADD COLUMN IF NOT EXISTS tier_tou  text NOT NULL DEFAULT '';
    ALTER TABLE billing_period ADD COLUMN IF NOT EXISTS rate_plan text NOT NULL DEFAULT '';

    -- Widen each primary key to include the tier. Without this a time-of-use hour
    -- that arrives as several tier rows would upsert over itself and only the last
    -- tier would survive -- silent, and invisible until a bill disagreed.
    DO $$
    DECLARE
      t record;
    BEGIN
      FOR t IN
        SELECT * FROM (VALUES
          ('hourly_usage',   'account, meter, local_date, hour_start, tier_tou'),
          ('daily_usage',    'account, meter, local_date, tier_tou'),
          ('billing_period', 'account, meter, period_start, tier_tou')
        ) AS v(tbl, cols)
      LOOP
        IF NOT EXISTS (
          SELECT 1
            FROM pg_index i
            JOIN pg_attribute a ON a.attrelid = i.indrelid AND a.attnum = ANY (i.indkey)
           WHERE i.indrelid = t.tbl::regclass AND i.indisprimary AND a.attname = 'tier_tou'
        ) THEN
          EXECUTE format('ALTER TABLE %I DROP CONSTRAINT %I', t.tbl, t.tbl || '_pkey');
          EXECUTE format('ALTER TABLE %I ADD PRIMARY KEY (%s)', t.tbl, t.cols);
          RAISE NOTICE 'widened primary key on % to include tier_tou', t.tbl;
        END IF;
      END LOOP;
    END
    $$;

    CREATE TEMP TABLE stg_hourly (
      account text, meter text, local_date date, hour_start smallint,
      tier_tou text, rate_plan text, kwh double precision
    ) ON COMMIT DROP;
    CREATE TEMP TABLE stg_daily (
      account text, meter text, local_date date,
      tier_tou text, rate_plan text, kwh double precision
    ) ON COMMIT DROP;
    CREATE TEMP TABLE stg_billing (
      account text, meter text, period_start date, period_end date,
      tier_tou text, rate_plan text, kwh double precision, amount_usd double precision
    ) ON COMMIT DROP;

    -- FORCE_NOT_NULL because CSV cannot distinguish an empty field from NULL, and
    -- an absent time-of-use tier is legitimately the empty string -- it is part of
    -- the primary key, so NULL is not an option.
    \copy stg_hourly  FROM '/data/hourly.csv'  WITH (FORMAT csv, HEADER true, FORCE_NOT_NULL (tier_tou, rate_plan))
    \copy stg_daily   FROM '/data/daily.csv'   WITH (FORMAT csv, HEADER true, FORCE_NOT_NULL (tier_tou, rate_plan))
    \copy stg_billing FROM '/data/billing.csv' WITH (FORMAT csv, HEADER true, FORCE_NOT_NULL (tier_tou, rate_plan))

    INSERT INTO hourly_usage (account, meter, local_date, hour_start, tier_tou, rate_plan, kwh, ts)
    SELECT account, meter, local_date, hour_start, tier_tou, rate_plan, kwh,
           -- Naive local wall time -> instant. Postgres owns the tz database, so
           -- this stays correct across DST rule changes without redeploying.
           (local_date + make_interval(hours => hour_start)) AT TIME ZONE 'America/Chicago'
      FROM stg_hourly
        ON CONFLICT (account, meter, local_date, hour_start, tier_tou) DO UPDATE
       SET kwh = EXCLUDED.kwh, ts = EXCLUDED.ts,
           rate_plan = EXCLUDED.rate_plan, updated_at = now()
        -- Skip no-op writes so updated_at stays meaningful as "when did this value
        -- last actually change".
     WHERE (hourly_usage.kwh, hourly_usage.rate_plan)
            IS DISTINCT FROM (EXCLUDED.kwh, EXCLUDED.rate_plan);

    INSERT INTO daily_usage (account, meter, local_date, tier_tou, rate_plan, kwh)
    SELECT account, meter, local_date, tier_tou, rate_plan, kwh FROM stg_daily
        ON CONFLICT (account, meter, local_date, tier_tou) DO UPDATE
       SET kwh = EXCLUDED.kwh, rate_plan = EXCLUDED.rate_plan, updated_at = now()
     WHERE (daily_usage.kwh, daily_usage.rate_plan)
            IS DISTINCT FROM (EXCLUDED.kwh, EXCLUDED.rate_plan);

    -- DISTINCT ON, not a bare SELECT: a duplicate period in the staging table makes
    -- the upsert below fail with "ON CONFLICT DO UPDATE command cannot affect row a
    -- second time", which aborts this transaction and so discards the hourly and
    -- daily series too -- a whole day of data lost to one bad billing row. The
    -- fetcher already drops the stub row that caused that, so this is the backstop
    -- for the next shape of duplicate. Ordering picks the real period over a stub:
    -- longest span first, then largest consumption.
    INSERT INTO billing_period (account, meter, period_start, period_end, tier_tou, rate_plan, kwh, amount_usd)
    SELECT account, meter, period_start, period_end, tier_tou, rate_plan, kwh, amount_usd
      FROM (
        SELECT DISTINCT ON (account, meter, period_start, tier_tou) *
          FROM stg_billing
         ORDER BY account, meter, period_start, tier_tou, period_end DESC, kwh DESC
      ) s
        ON CONFLICT (account, meter, period_start, tier_tou) DO UPDATE
       SET period_end = EXCLUDED.period_end, kwh = EXCLUDED.kwh,
           amount_usd = EXCLUDED.amount_usd, rate_plan = EXCLUDED.rate_plan, updated_at = now()
     WHERE (billing_period.kwh, billing_period.amount_usd, billing_period.rate_plan)
            IS DISTINCT FROM (EXCLUDED.kwh, EXCLUDED.amount_usd, EXCLUDED.rate_plan);

    INSERT INTO collector_run (hourly_rows, daily_rows, billing_rows)
    SELECT (SELECT count(*) FROM stg_hourly),
           (SELECT count(*) FROM stg_daily),
           (SELECT count(*) FROM stg_billing);

    -- Blended $/kWh per billing period, spread back over the hours it covers, so
    -- hourly usage can be costed. Alliant bills on read-to-read periods that do not
    -- align to months, which is exactly the join SQL makes easy and PromQL does not.
    -- Joining on tier as well as period is what makes this survive the switch to
    -- time-of-use. Today every tier is '' so it is a no-op. Once tiers arrive, an
    -- on-peak hour costs at the on-peak period's blended rate rather than at one
    -- rate smeared across the whole bill -- and, just as importantly, the join
    -- stops fanning out one hourly row across every tier row of its period, which
    -- would multiply the cost by the number of tiers.
    --
    -- Still an approximation while a period has one tier: it spreads fixed charges
    -- across kWh rather than modelling the tariff, so per-hour cost is indicative
    -- and the period total is exact.
    -- Dropped and recreated rather than CREATE OR REPLACE: replace can only append
    -- columns, so any change to the column *order* fails against an existing view.
    -- Safe because a view holds no data, and the grant block below re-grants it.
    DROP VIEW IF EXISTS hourly_usage_cost;
    CREATE VIEW hourly_usage_cost AS
    SELECT h.account, h.meter, h.ts, h.local_date, h.hour_start, h.tier_tou, h.kwh,
           b.amount_usd / NULLIF(b.kwh, 0)               AS rate_usd_per_kwh,
           h.kwh * (b.amount_usd / NULLIF(b.kwh, 0))     AS cost_usd
      FROM hourly_usage h
      LEFT JOIN billing_period b
        ON b.account = h.account AND b.meter = h.meter
       AND b.tier_tou = h.tier_tou
       AND h.local_date > b.period_start AND h.local_date <= b.period_end;

    -- Grafana reads through the shared hand-made `grafanareader` role against the
    -- prod-pg17-ro replica, so it needs SELECT here. Done on every run rather than
    -- once by hand: it is idempotent, and it means a table added later is readable
    -- without anyone remembering to re-grant.
    --
    -- Guarded because the role is not managed by this repo (or by CNPG) -- if it is
    -- ever absent, the collector should still load data rather than abort the whole
    -- transaction on a missing grantee.
    DO $$
    BEGIN
      IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'grafanareader') THEN
        GRANT CONNECT ON DATABASE energy TO grafanareader;
        GRANT USAGE ON SCHEMA public TO grafanareader;
        GRANT SELECT ON ALL TABLES IN SCHEMA public TO grafanareader;
        -- Covers tables and views created by future runs of this script.
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO grafanareader;
      END IF;
    END
    $$;
  tariff.sql: |
    -- Alliant residential rate model, applied to real hourly usage.
    --
    -- Alliant's hourly feed carries no price at all -- the only money in the API is
    -- a total per billing period. So to answer "what did this hour cost" (and, more
    -- usefully, "what would it have cost on another plan") the tariff has to be
    -- modelled here.
    --
    -- The account is on RD1 (Peak Nights and Weekends). RG5 and RG1 are carried too
    -- so the plans can be compared against the same real usage, which is the only
    -- honest way to judge whether the switch was worth it.
    --
    -- IMPORTANT: billing moved to RD1 with the 2026-07-23..2026-08-21 bill, which
    -- is tiered (585 High / 774 Regular / 1,543 Low kWh). The *feed* has not caught
    -- up: tier_tou is still empty and the monthly endpoint still returns one
    -- untiered total, so this model remains the only per-hour tier breakdown there
    -- is. Validated against that bill -- the window definitions below reproduce its
    -- split to within 0.7 points on every tier.

    -- Drops a view or materialized view by name whichever it currently is. Needed
    -- because DROP VIEW and DROP MATERIALIZED VIEW each raise if the name exists as
    -- the other kind -- precisely what happens on a deploy that converts one to the
    -- other, which would wedge the load for everyone after.
    CREATE OR REPLACE FUNCTION drop_relation_any_kind(p_name text)
    RETURNS void LANGUAGE plpgsql AS $fn$
    DECLARE k "char";
    BEGIN
      SELECT relkind INTO k FROM pg_class
       WHERE relname = p_name AND relnamespace = 'public'::regnamespace;
      IF    k = 'v' THEN EXECUTE format('DROP VIEW %I', p_name);
      ELSIF k = 'm' THEN EXECUTE format('DROP MATERIALIZED VIEW %I', p_name);
      END IF;
    END
    $fn$;

    -- Dropped up front, not just before each CREATE below. A migration that alters
    -- a base-table column fails outright while a view still depends on it -- which
    -- is exactly how the numeric(10,5) widening below wedged the load once: it
    -- passed on an empty database, where the column is simply created at the right
    -- precision and the migration never runs, and failed on the real one. Dropping
    -- the derived objects first makes column migrations safe by construction.
    -- Everything here is rebuilt further down, and holds no data of its own.
    SELECT drop_relation_any_kind('bill_estimate');
    SELECT drop_relation_any_kind('billing_day');
    SELECT drop_relation_any_kind('demand_estimate');
    SELECT drop_relation_any_kind('hourly_usage_priced');

    CREATE TABLE IF NOT EXISTS tou_plan (
      plan                 text PRIMARY KEY,
      description          text          NOT NULL,
      is_flat              boolean       NOT NULL,
      monthly_customer_usd numeric(10,2) NOT NULL,
      -- Charged on the highest demand seen in the window, not on energy. Only RD1
      -- has one, and it is the main reason RD1's per-kWh prices undercut RG5's.
      demand_usd_per_kw    numeric(10,2) NOT NULL DEFAULT 0
    );

    INSERT INTO tou_plan (plan, description, is_flat, monthly_customer_usd, demand_usd_per_kw) VALUES
      ('RD1', 'Peak Nights and Weekends (Residential Demand Service) -- current plan', false, 10.00, 5.88),
      ('RG5', 'Nights and Weekends (Residential Service Electric TOD)',                false, 15.00, 0.00),
      ('RG1', 'Residential Electric Service (flat)',                                   true,  15.00, 0.00)
    ON CONFLICT (plan) DO UPDATE
       SET description = EXCLUDED.description, is_flat = EXCLUDED.is_flat,
           monthly_customer_usd = EXCLUDED.monthly_customer_usd,
           demand_usd_per_kw = EXCLUDED.demand_usd_per_kw;

    CREATE TABLE IF NOT EXISTS tou_price (
      plan        text NOT NULL REFERENCES tou_plan(plan),
      period      text NOT NULL,               -- low | regular | high | flat
      usd_per_kwh numeric(10,5) NOT NULL,
      PRIMARY KEY (plan, period)
    );

    -- Migration: Alliant quotes to five decimals ($0.08514), which numeric(10,4)
    -- silently rounded off. Guarded so the table is rewritten once, not every run.
    DO $$
    BEGIN
      IF EXISTS (SELECT 1 FROM information_schema.columns
                  WHERE table_name = 'tou_price' AND column_name = 'usd_per_kwh'
                    AND numeric_scale < 5) THEN
        ALTER TABLE tou_price ALTER COLUMN usd_per_kwh TYPE numeric(10,5);
      END IF;
    END
    $$;

    -- All three transcribed from the PSCW-filed tariff (Docket 6680-UR-125,
    -- effective 2026-01-01), so every plan in the comparison is now exact rather
    -- than rounded off a summary sheet. RD1 additionally agrees with the
    -- 2026-07-23..2026-08-21 bill to the cent.
    INSERT INTO tou_price (plan, period, usd_per_kwh) VALUES
      ('RD1', 'low', 0.08514), ('RD1', 'regular', 0.17914), ('RD1', 'high', 0.25914),
      ('RG5', 'low', 0.09514), ('RG5', 'regular', 0.21014), ('RG5', 'high', 0.29914),
      ('RG1', 'flat', 0.17011)
    ON CONFLICT (plan, period) DO UPDATE SET usd_per_kwh = EXCLUDED.usd_per_kwh;

    -- Weekends AND holidays bill at the low rate all day, so the holiday list is
    -- rate-affecting, not decoration. Only holidays landing on a weekday actually
    -- change anything -- a weekend is already low.
    --
    -- CONFIRMED against the filed tariff, which names exactly these six: New Year's
    -- Day, Memorial Day, Independence Day, Labor Day, Thanksgiving Day, Christmas
    -- Day. Rd-1 names the same six again for demand, so one list serves both.
    CREATE TABLE IF NOT EXISTS tou_holiday (
      day         date PRIMARY KEY,
      name        text NOT NULL,
      is_observed boolean NOT NULL DEFAULT false   -- shifted off a weekend
    );

    DO $$
    DECLARE
      y   int;
      d   date;
      obs date;
    BEGIN
      FOR y IN 2024..2035 LOOP
        -- Fixed-date holidays, shifted to the nearest weekday when they land on a
        -- weekend (Sat -> Fri, Sun -> Mon), which is how observed holidays work.
        FOR d IN SELECT unnest(ARRAY[make_date(y,1,1), make_date(y,7,4), make_date(y,12,25)]) LOOP
          obs := CASE extract(isodow FROM d)
                   WHEN 6 THEN d - 1
                   WHEN 7 THEN d + 1
                   ELSE d
                 END;
          INSERT INTO tou_holiday (day, name, is_observed)
          VALUES (obs,
                  CASE to_char(d, 'MM-DD')
                    WHEN '01-01' THEN 'New Year''s Day'
                    WHEN '07-04' THEN 'Independence Day'
                    ELSE 'Christmas Day'
                  END,
                  obs <> d)
          ON CONFLICT (day) DO NOTHING;
        END LOOP;

        -- Memorial Day: last Monday in May.
        INSERT INTO tou_holiday (day, name)
        SELECT max(g)::date, 'Memorial Day'
          FROM generate_series(make_date(y,5,1), make_date(y,5,31), '1 day') g
         WHERE extract(isodow FROM g) = 1
        ON CONFLICT (day) DO NOTHING;

        -- Labor Day: first Monday in September.
        INSERT INTO tou_holiday (day, name)
        SELECT min(g)::date, 'Labor Day'
          FROM generate_series(make_date(y,9,1), make_date(y,9,30), '1 day') g
         WHERE extract(isodow FROM g) = 1
        ON CONFLICT (day) DO NOTHING;

        -- Thanksgiving: fourth Thursday in November.
        INSERT INTO tou_holiday (day, name)
        SELECT (array_agg(g ORDER BY g))[4]::date, 'Thanksgiving'
          FROM generate_series(make_date(y,11,1), make_date(y,11,30), '1 day') g
         WHERE extract(isodow FROM g) = 4
        ON CONFLICT (day) DO NOTHING;
      END LOOP;
    END
    $$;

    -- Which rate window an hour falls in. Hours are period-start (hour_start = 6
    -- means 06:00-07:00), so "6-11 a.m." is hours 6..10 inclusive. Each branch
    -- covers all 24 hours exactly once.
    CREATE OR REPLACE FUNCTION tou_period_for(p_month int, p_offpeak_day boolean, p_hour int)
    RETURNS text
    LANGUAGE sql IMMUTABLE AS $$
      SELECT CASE
        -- Weekends and holidays: low all day, every season.
        WHEN p_offpeak_day THEN 'low'
        -- Jun/Jul/Aug weekdays: 6-11a regular, 11a-7p high, 7-11p regular, 11p-6a low.
        WHEN p_month IN (6,7,8) THEN
          CASE WHEN p_hour BETWEEN 6 AND 10  THEN 'regular'
               WHEN p_hour BETWEEN 11 AND 18 THEN 'high'
               WHEN p_hour BETWEEN 19 AND 22 THEN 'regular'
               ELSE 'low' END
        -- Jan/Feb/Dec weekdays: 6a-5p regular, 5-9p high, 9-11p regular, 11p-6a low.
        WHEN p_month IN (1,2,12) THEN
          CASE WHEN p_hour BETWEEN 6 AND 16  THEN 'regular'
               WHEN p_hour BETWEEN 17 AND 20 THEN 'high'
               WHEN p_hour BETWEEN 21 AND 22 THEN 'regular'
               ELSE 'low' END
        -- Shoulder months: no high window at all, 6a-11p regular, 11p-6a low.
        ELSE
          CASE WHEN p_hour BETWEEN 6 AND 22 THEN 'regular' ELSE 'low' END
      END;
    $$;

    -- Every hour of usage priced under every plan. One row per (hour, plan), which
    -- is what makes a like-for-like plan comparison a plain GROUP BY.
    --
    -- MATERIALIZED deliberately. As a plain view the planner re-evaluated it once
    -- per billing period inside bill_estimate and the aggregate took over 90s; as a
    -- table it is ~37k rows built once a day and every dashboard query is instant.
    -- The data only changes when the collector runs, so there is nothing to gain
    -- from computing it per query.
    CREATE MATERIALIZED VIEW hourly_usage_priced AS
    SELECT h.account, h.meter, h.ts, h.local_date, h.hour_start, h.kwh,
           pl.plan,
           d.is_offpeak_day,
           CASE WHEN pl.is_flat THEN 'flat'
                ELSE tou_period_for(extract(month FROM h.local_date)::int, d.is_offpeak_day, h.hour_start)
           END AS period,
           pr.usd_per_kwh,
           h.kwh * pr.usd_per_kwh AS energy_cost_usd
      FROM hourly_usage h
     CROSS JOIN tou_plan pl
      JOIN LATERAL (
        SELECT (extract(isodow FROM h.local_date) >= 6
                OR EXISTS (SELECT 1 FROM tou_holiday x WHERE x.day = h.local_date)) AS is_offpeak_day
      ) d ON true
      JOIN tou_price pr
        ON pr.plan = pl.plan
       AND pr.period = CASE WHEN pl.is_flat THEN 'flat'
                            ELSE tou_period_for(extract(month FROM h.local_date)::int, d.is_offpeak_day, h.hour_start)
                       END;

    CREATE INDEX hourly_usage_priced_plan_date_idx ON hourly_usage_priced (plan, local_date);
    CREATE INDEX hourly_usage_priced_ts_idx         ON hourly_usage_priced (ts);

    -- A freshly built materialized view carries no statistics until autovacuum gets
    -- to it, and the planner's default guesses were bad enough that building
    -- bill_estimate off it nested-looped and ran for minutes. Analyze immediately so
    -- the very next statement in this same transaction plans against real numbers.
    ANALYZE hourly_usage_priced;

    -- Demand charge basis: the single highest hour on nonholiday weekdays between
    -- 10:00 and 20:00, per billing period.
    --
    -- KNOWN WRONG, and biased *high* -- pending confirmation against the rate sheet.
    -- The 2026-07-23 bill charged 5.704 kW of on-peak demand; this window yields
    -- 10.393. The whole gap is hour_start 19 (19:00-20:00): every window ending at
    -- 18 reproduces the billed figure exactly, on that period and the one before.
    -- Alliant's own hourly feed is what the demand register reports (the bill's
    -- off-peak demand, 11.239 kW, is exactly the period's peak hour), so this is a
    -- window definition problem, not a metering-interval one -- the earlier note
    -- here blamed 15-minute metering, which the exact match rules out.
    --
    -- Deliberately left matching the tariff, which is unambiguous: "the Measured
    -- Maximum Demand which occurs during weekdays (Monday through Friday) between
    -- 10 a.m. to 8 p.m." That is hour_start 10..19, what this computes. Alliant's
    -- own bill disagrees with Alliant's own tariff -- it billed as though the
    -- window closed at 7pm, skipping a 5.775 kW hour at 19:00-20:00 on Fri
    -- 2026-08-07 to charge a 5.704 kW hour instead, $27.57 in our favour.
    --
    -- So this reads high against the *bill* and correct against the *contract*, and
    -- one bill is not enough to tell a billing bug from a rule we have misread.
    -- Revisit once a second RD1 bill lands; if it repeats, model what Alliant
    -- actually does and keep this note for when they fix it.
    CREATE MATERIALIZED VIEW demand_estimate AS
    SELECT b.account, b.meter, b.period_start, b.period_end,
           max(h.kwh) AS peak_kw_est
      FROM billing_period b
      JOIN hourly_usage h
        ON h.account = b.account AND h.meter = b.meter
       AND h.local_date > b.period_start AND h.local_date <= b.period_end
     WHERE h.hour_start BETWEEN 10 AND 19
       AND extract(isodow FROM h.local_date) < 6
       AND NOT EXISTS (SELECT 1 FROM tou_holiday x WHERE x.day = h.local_date)
     GROUP BY 1, 2, 3, 4;

    -- Modelled all-in bill per plan per billing period: energy + demand + the fixed
    -- monthly charge. Comparable to billing_period.amount_usd, which is what was
    -- actually charged.
    ANALYZE demand_estimate;

    -- One row per (billing period, day). Exists purely so the aggregates below can
    -- join on date *equality*: joining hourly rows to periods on a range predicate
    -- forces a nested loop that re-evaluates the priced view once per period, which
    -- took bill_estimate from milliseconds to over 90 seconds.
    CREATE VIEW billing_day AS
    SELECT b.account, b.meter, b.period_start, b.period_end, d.day::date AS local_date
      FROM billing_period b
      JOIN LATERAL generate_series(b.period_start + 1, b.period_end, interval '1 day') d(day) ON true
     WHERE b.tier_tou = '';

    CREATE MATERIALIZED VIEW bill_estimate AS
    SELECT p.account, p.meter, bd.period_start, bd.period_end, p.plan,
           sum(p.energy_cost_usd)                                      AS energy_usd,
           coalesce(max(d.peak_kw_est), 0) * max(pl.demand_usd_per_kw)  AS demand_usd,
           max(pl.monthly_customer_usd)                                AS customer_usd,
           sum(p.energy_cost_usd)
             + coalesce(max(d.peak_kw_est), 0) * max(pl.demand_usd_per_kw)
             + max(pl.monthly_customer_usd)                            AS total_usd,
           sum(p.kwh)                                                  AS kwh
      FROM hourly_usage_priced p
      JOIN billing_day bd
        ON bd.account = p.account AND bd.meter = p.meter AND bd.local_date = p.local_date
      JOIN tou_plan pl ON pl.plan = p.plan
      LEFT JOIN demand_estimate d
        ON d.account = p.account AND d.meter = p.meter AND d.period_start = bd.period_start
     GROUP BY 1, 2, 3, 4, 5;
    ANALYZE bill_estimate;

    -- Grafana reads these through grafanareader; the grant block in load.sql runs
    -- before these views exist on a fresh database, so re-grant here.
    DO $$
    BEGIN
      IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'grafanareader') THEN
        GRANT SELECT ON ALL TABLES IN SCHEMA public TO grafanareader;
      END IF;
    END
    $$;
immutable: false

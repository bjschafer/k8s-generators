apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      auth:
        jwt:
          kubernetesServiceAccountToken:
            expirationSeconds: 600
            serviceAccountRef:
              audiences:
                - https://openbao.cmdcentral.xyz
              name: openbao-auth
              namespace: external-secrets
          path: kubernetes
          role: eso
      path: kv
      server: https://openbao.cmdcentral.xyz
      version: v2

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-db-creds
  namespace: paperless
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/paperless/paperless-db-creds
        metadataPolicy: None
        property: PAPERLESS_DBPASS
      secretKey: PAPERLESS_DBPASS
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless-db-creds

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: paperless
    app.kubernetes.io/managed-by: generators
    app.kubernetes.io/name: tika
    component: tika
  name: tika
  namespace: paperless
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: tika-tika-deployment-c88b096a
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: paperless
        app.kubernetes.io/name: tika
        cdk8s.io/metadata.addr: tika-tika-deployment-c88b096a
        component: tika
    spec:
      automountServiceAccountToken: false
      containers:
        - image: docker.io/apache/tika:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /tika
              port: 9998
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
          name: tika
          ports:
            - containerPort: 9998
              name: web
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /tika
              port: 9998
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 800m
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          startupProbe:
            failureThreshold: 24
            httpGet:
              path: /tika
              port: 9998
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 5
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsNonRoot: true
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30

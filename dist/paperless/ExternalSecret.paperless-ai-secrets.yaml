apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ai-secrets
  namespace: paperless
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/paperless/paperless-ai-secrets
        metadataPolicy: None
        property: CUSTOM_API_KEY
      secretKey: CUSTOM_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless-ai-secrets

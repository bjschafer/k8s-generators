apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-oidc
  namespace: paperless
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/paperless/authentik
        metadataPolicy: None
        property: client_id
      secretKey: client_id
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/paperless/authentik
        metadataPolicy: None
        property: client_secret
      secretKey: client_secret
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless-oidc
    template:
      data:
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"APPS":[{"provider_id":"authentik","name":"Authentik","client_id":"{{ .client_id }}","secret":"{{ .client_secret }}","settings":{"server_url":"https://login.cmdcentral.xyz/application/o/paperless/.well-known/openid-configuration"}}],"OAUTH_PKCE_ENABLED":"True"}}'
      engineVersion: v2

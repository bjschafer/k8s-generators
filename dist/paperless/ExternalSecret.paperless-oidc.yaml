apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-oidc
  namespace: paperless
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/paperless/paperless-oidc
        metadataPolicy: None
        property: PAPERLESS_SOCIALACCOUNT_PROVIDERS
      secretKey: PAPERLESS_SOCIALACCOUNT_PROVIDERS
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: paperless-oidc

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-book-request-secrets
  namespace: bookorbit
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: ^password$
            target: book-request-encryption-key
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bookorbit-book-request-secrets-book-request-encryption-key
  refreshInterval: "0"
  target:
    name: bookorbit-book-request-secrets
    template:
      data:
        BOOK_REQUEST_ENCRYPTION_KEY: '{{ index . "book-request-encryption-key" | sha256sum }}'

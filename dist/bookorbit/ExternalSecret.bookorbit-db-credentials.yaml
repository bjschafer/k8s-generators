apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-db-credentials
  namespace: bookorbit
spec:
  data:
    - remoteRef:
        key: bookorbit-db-credentials
        property: password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kubernetes
  target:
    name: bookorbit-db-credentials

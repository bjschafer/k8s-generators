apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    velero.io/exclude-from-backup: "true"
  name: bookorbit-nfs-books
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1024Gi
  nfs:
    path: /warp/Media/Ebooks
    server: 10.0.151.5
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem

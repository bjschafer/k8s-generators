apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: generators
    app.kubernetes.io/name: bookorbit
  name: bookorbit
  namespace: bookorbit
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: bookorbit-bookorbit-deployment-c8f1541f
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookorbit
        cdk8s.io/metadata.addr: bookorbit-bookorbit-deployment-c8f1541f
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: TZ
              value: America/Chicago
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: POSTGRES_HOST
              value: immich-rw.postgres.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: bookorbit
            - name: POSTGRES_USER
              value: bookorbit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: bookorbit-db-credentials
            - name: APP_URL
              value: https://ebooks.cmdcentral.xyz
            - name: TRUST_PROXY
              value: "true"
            - name: OIDC_ALLOW_LOCAL_ISSUERS
              value: "true"
            - name: LIBRARY_BROWSE_ROOT
              value: /
            - name: PUID
              value: "8675309"
            - name: PGID
              value: "8675309"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: JWT_SECRET
                  name: bookorbit-secrets
            - name: SETUP_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  key: SETUP_BOOTSTRAP_TOKEN
                  name: bookorbit-secrets
            - name: EMAIL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: EMAIL_ENCRYPTION_KEY
                  name: bookorbit-secrets
            - name: MIGRATION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: MIGRATION_ENCRYPTION_KEY
                  name: bookorbit-secrets
          image: ghcr.io/bookorbit/bookorbit
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/v1/health
              port: 3000
              scheme: HTTP
          name: bookorbit
          ports:
            - containerPort: 3000
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/v1/health
              port: 3000
              scheme: HTTP
          resources:
            limits:
              cpu: "2"
              memory: 2048Mi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/v1/health
              port: 3000
              scheme: HTTP
            periodSeconds: 10
          volumeMounts:
            - mountPath: /data
              name: pvc-data
            - mountPath: /books
              name: pvc-nfs-books
            - mountPath: /audiobooks
              name: pvc-nfs-audiobooks
            - mountPath: /comics
              name: pvc-nfs-comics
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsNonRoot: false
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: pvc-data
          persistentVolumeClaim:
            claimName: data
            readOnly: false
        - name: pvc-nfs-books
          persistentVolumeClaim:
            claimName: nfs-books
            readOnly: false
        - name: pvc-nfs-audiobooks
          persistentVolumeClaim:
            claimName: nfs-audiobooks
            readOnly: false
        - name: pvc-nfs-comics
          persistentVolumeClaim:
            claimName: nfs-comics
            readOnly: false

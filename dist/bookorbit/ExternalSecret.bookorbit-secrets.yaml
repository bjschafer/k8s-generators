apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-secrets
  namespace: bookorbit
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: ^password$
            target: jwt-secret
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bookorbit-secrets-jwt-secret
    - rewrite:
        - regexp:
            source: ^password$
            target: setup-bootstrap-token
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bookorbit-secrets-setup-bootstrap-token
    - rewrite:
        - regexp:
            source: ^password$
            target: email-encryption-key
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bookorbit-secrets-email-encryption-key
    - rewrite:
        - regexp:
            source: ^password$
            target: migration-encryption-key
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bookorbit-secrets-migration-encryption-key
  refreshInterval: "0"
  target:
    name: bookorbit-secrets
    template:
      data:
        EMAIL_ENCRYPTION_KEY: '{{ index . "email-encryption-key" | sha256sum }}'
        JWT_SECRET: '{{ index . "jwt-secret" }}'
        MIGRATION_ENCRYPTION_KEY: '{{ index . "migration-encryption-key" | sha256sum }}'
        SETUP_BOOTSTRAP_TOKEN: '{{ index . "setup-bootstrap-token" }}'

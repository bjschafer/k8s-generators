apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich
  namespace: postgres
spec:
  bootstrap:
    recovery:
      source: immich-pg16
  enableSuperuserAccess: true
  externalClusters:
    - name: immich-pg16
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: immich-pg16
          serverName: immich-pg16
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    major: 17
    name: vectorchord
  inheritedMetadata:
    labels:
      velero.io/exclude-from-backup: "true"
  instances: 2
  monitoring:
    enablePodMonitor: false
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: immich
  postgresql:
    parameters:
      max_slot_wal_keep_size: 1GB
    shared_preload_libraries:
      - vchord.so
  resources:
    limits:
      cpu: 600m
      memory: 768Mi
    requests:
      cpu: 600m
      memory: 768Mi
  storage:
    size: 15Gi
    storageClass: ceph-rbd

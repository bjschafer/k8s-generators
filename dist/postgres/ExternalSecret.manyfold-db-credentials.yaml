apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manyfold-db-credentials
  namespace: postgres
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: kubernetes/_all/manyfold-db-credentials
        metadataPolicy: None
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: manyfold-db-credentials
    template:
      data:
        password: "{{ .password }}"
        username: manyfold
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth

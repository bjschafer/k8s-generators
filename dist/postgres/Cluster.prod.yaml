apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prod
  namespace: postgres
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: kubernetes.io/arch
                operator: NotIn
                values:
                  - arm64
          weight: 1
  bootstrap:
    recovery:
      source: prod-pg17
  enableSuperuserAccess: true
  externalClusters:
    - connectionParameters:
        dbname: postgres
        host: prod-pg17-rw.postgres.svc
        sslmode: verify-full
        user: streaming_replica
      name: prod-pg17
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: prod-pg17
          serverName: prod-pg18
      sslCert:
        key: tls.crt
        name: prod-pg17-replication
      sslKey:
        key: tls.key
        name: prod-pg17-replication
      sslRootCert:
        key: ca.crt
        name: prod-pg17-ca
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    major: 18
    name: postgresql-minimal-trixie
  inheritedMetadata:
    labels:
      velero.io/exclude-from-backup: "true"
  instances: 3
  monitoring:
    enablePodMonitor: false
  plugins:
    - isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: prod
        serverName: prod-pg18
  postgresql:
    parameters:
      lc_messages: C
      lc_monetary: C
      lc_numeric: C
      lc_time: C
      max_connections: "300"
      max_slot_wal_keep_size: 1GB
  primaryUpdateMethod: switchover
  priorityClassName: homelab-critical
  replica:
    enabled: false
    source: prod-pg17
  resources:
    limits:
      cpu: "1"
      memory: 4Gi
    requests:
      cpu: "1"
      memory: 4Gi
  storage:
    size: 15Gi
    storageClass: ceph-rbd

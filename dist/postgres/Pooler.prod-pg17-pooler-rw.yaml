apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: prod-pg17-pooler-rw
  namespace: postgres
spec:
  cluster:
    name: prod-pg17
  instances: 3
  pgbouncer:
    parameters:
      default_pool_size: "20"
      max_client_conn: "1000"
      server_idle_timeout: "600"
    poolMode: session
  template:
    spec:
      containers:
        - livenessProbe:
            failureThreshold: 6
            periodSeconds: 10
            tcpSocket:
              port: 5432
            timeoutSeconds: 5
          name: pgbouncer
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 96Mi
      priorityClassName: homelab-critical
  type: rw
